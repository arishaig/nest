# --- Survivor Library (survivorlibrary.com) ---------------------------------
# 1800s-early-1900s technical books, ~13.7k scanned PDFs (~200 GB), nearly all
# with an OCR text layer. survivor.py mirrors these categories (or --all) to
# the NAS at reference/survivor-library/<site category>/; convert.py treats
# each PDF as a book, filed under the mapped category/priority below.
# NB: historical — e.g. 1890s canning advice predates modern food-safety
# guidance (the USDA guide above is the reference for that).
survivor_library:
  medical: {priority: 3, site: [medical_emergency, medical_nursing, medical_courses_us_army, dentistry, herbalism,
                                medical_obstetrics_1900-1922, medical_anesthesia, medical_surgery_1900-1922, optometry]}
  water: {priority: 3, site: [sanitation, sewage, drilling, engineering_hydraulics, wind_and_water, rat_control]}
  food: {priority: 3, site: [canning, food, butchering, cheese_and_butter, baking, brewing_and_distilling]}
  shelter-survival: {priority: 3, site: [survival_individual, shelter, trapping_hunting, fishing, boy_scout_manuals,
                                         navigation, surveying, meteorology]}
  preparedness: {priority: 3, site: [nbc]}
  agriculture: {priority: 4, site: [farming, poultry, beekeeping, livestock_cattle, livestock_sheep, livestock_swine, veterinary,
                                    mushrooms, berries, livestock_rabbits_and_cavies, horses, dogs, farming_potato_and_sweet_potato,
                                    farming_corn, grapes_wine_raisins, forestry]}
  tools-building: {priority: 4, site: [smithing, forging_and_casting, wood_carpentry, stone_and_masonry, soap, leather, weaving,
                                       shoemaking, hemp_flax, pottery, basketry, knitting_lace_needlepoint, sewing, glassmaking,
                                       papermaking, machine_tools, welding, chemistry, formulas, fuels]}
  electricity-radio: {priority: 3, site: [radio, telegraph_and_telephone, engineering_electrical]}
  education: {priority: 3, site: [primers, teaching_readers_mcguffey, teaching_phonics, teaching_arithmetic, mathematics]}
