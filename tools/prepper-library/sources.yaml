# Prepper / emergency reference library — source manifest.
#
# Only free / public-domain material. Content never lands in git (this repo is
# public): fetch.py stages files locally and pushes them to the NAS at
# /Tank/media_root/media/reference/sources/<category>/<id>/. Per-file sha256s
# are recorded in sources.lock.json on first fetch so upstream changes show up
# as a diff.
#
# Types:
#   url      single file
#   parts    one book published as several files (each part becomes a chapter)
#   zimgit   Kiwix "zimgit" ZIM bundle; fetch.py unpacks its PDFs + titles
#   legacy   already on the NAS (migrated from reference/to_import); not fetched
#
# priority: 1 = goes on every device first; higher numbers fill remaining space.
# Prefer a born-digital EPUB/HTML edition over a PDF whenever one exists.

categories: [medical, water, food, foraging, shelter-survival, preparedness, electricity-radio, agriculture, tools-building, military]

sources:
