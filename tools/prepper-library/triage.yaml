# Prepper library curation: which books matter, and how much.
#
# Every book gets a tier. Devices take whole tiers of whole topics (see
# build-devices.py), so what's on a device can be printed on a label.
# Tiers judge usefulness to a household without outside help, by subject,
# not age: an 1880s camp-sanitation manual is post-germ-theory and still
# right; a sewer-discharge table book is useless because it's municipal-scale.
#
# Resolution, most specific first:
#   1. a book's stem listed under a tier in its source/category `books`
#   2. the source/category `tier`
#   3. sources.yaml priority (capped at 4) for anything not mentioned here
# Hazard flags come from the category `hazard` (minus `safe`) plus `flag`.
#
# Stems: survivor books are keyed by PDF stem; zimgit books by their file stem
# inside the bundle. Check names and see tier sizes: `uv run triage.py --root <NAS reference mount>`.

tiers:
  1: "Survive: first days to months. Injuries and illness, water, sanitation, shelter, fire, food safety, foraging, navigation, fallout"
  2: "Sustain: feeding and keeping people and animals healthy for years. Gardening, livestock, dairy, baking, nursing, home trades"
  3: "Rebuild: trades and deep references. Smithing, foundry, masonry, carpentry, leather, weaving, specialist medicine"
  4: "Archive: NAS/Kiwix only. Periodicals, superseded editions, industrial/municipal scale, histories, memoirs, fiction, curiosities"

hazards:
  old-medicine: "Pre-modern medicine: doses and remedies may be useless or poisonous; check against Where There Is No Doctor"
  old-food-safety: "Pre-USDA canning/preserving: use the USDA guide's methods and times"
  id-caution: "Wild food ID: never eat a plant or mushroom on one book's identification; taxonomy and lookalikes have changed"

