[project]
name = "lidarr-triage"
version = "0.1.0"
description = "Triage a Lidarr library against Spotify Extended Streaming History"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "rapidfuzz==3.14.6",
]

[project.scripts]
lidarr-triage = "lidarr_triage.cli:main"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "respx==0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lidarr_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
