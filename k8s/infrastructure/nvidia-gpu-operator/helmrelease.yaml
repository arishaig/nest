apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: gpu-operator
      # Pinned back to v26.3.3 (from the Renovate v26.7.0 bump in #520).
      # v26.7.0's Helm pre-upgrade hook `Job/gpu-operator-upgrade-crd` wedges:
      # its hook ServiceAccount (gpu-operator-upgrade-crd-hook-sa) is never
      # created, so the Job retries pod creation forever, the Helm upgrade
      # goes Failed, Flux can't auto-rollback ("missing target release"), and
      # the infrastructure Kustomization's health check on this HelmRelease
      # fails — which blocked the apps Kustomization (dependsOn:
      # infrastructure) for ~2 days. Renovate is pinned <=v26.3.3 in
      # renovate.json until the v26.7+ CRD-hook upgrade path is sorted.
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  values:
    # Driver and toolkit are already installed as Talos system extensions
    # (siderolabs/nvidia-open-gpu-kernel-modules + nvidia-container-toolkit,
    # baked into talos-omega's install image — see
    # talos/patches/worker-omega.yaml). Letting the operator also try to
    # install its own would conflict with Talos's immutable/extension-managed
    # driver.
    driver:
      enabled: false
    toolkit:
      enabled: false
    hostPaths:
      driverInstallDir: /usr/local

    # omega advertises exactly one nvidia.com/gpu (no MIG on a 3080). Without
    # time-slicing, subgen, tdarr-node, and anagnorisis — all requesting
    # `nvidia.com/gpu: 1` (k8s/apps/media/subgen.yaml,
    # k8s/apps/media/tdarr-node.yaml, k8s/apps/media/anagnorisis.yaml) —
    # would leave some of them permanently Pending since the resource can't
    # be shared. 3 replicas covers those three concurrent consumers now that
    # anagnorisis has a CUDA image (see docs/gaming-gpu-talos.md). This
    # multiplexes SMs, not the 10GB of VRAM — three CUDA workloads sharing it
    # concurrently is the ceiling to watch, not just the replica count.
    devicePlugin:
      config:
        create: true
        name: time-slicing-config
        default: time-slicing
        data:
          time-slicing: |-
            version: v1
            sharing:
              timeSlicing:
                resources:
                - name: nvidia.com/gpu
                  replicas: 3

    # No manual nodeSelector is set for the GPU operand DaemonSets
    # (device-plugin, dcgm-exporter, gpu-feature-discovery, etc.) — the chart
    # doesn't expose one. They self-scope: Node Feature Discovery (enabled by
    # default, runs its lightweight PCI scan on every node — harmless on the
    # arm64 RPi5 workers, this is its actual job) labels any node with an
    # NVIDIA PCI device (vendor 10de) present, and the operator's own
    # ClusterPolicy controller then dynamically injects nodeSelectors onto
    # the operand DaemonSets based on that label. Since talos-omega is the
    # only node with an NVIDIA GPU, the heavy operand pods will only ever
    # land there — verify with `kubectl get pods -n gpu-operator -o wide`
    # after install.
