# Exposes helm-controller's Prometheus metrics (:8080 http-prom) over the
# shared MetalLB metrics IP (192.168.1.116). Single replica. Provides
# gotk_reconcile_condition{kind="HelmRelease",...} — the series behind
# FluxHelmReleaseNotReady, which is what would have caught the gpu-operator
# v26.7.0 failure directly instead of only via the (now removed) infrastructure
# Kustomization health gate. External port 8083.
apiVersion: v1
kind: Service
metadata:
  name: helm-controller-metrics
  namespace: flux-system
  annotations:
    metallb.io/loadBalancerIPs: "192.168.1.116"
    metallb.io/allow-shared-ip: "metrics"
spec:
  type: LoadBalancer
  selector:
    app: helm-controller
  ports:
    - name: http-prom
      port: 8083
      targetPort: http-prom
      nodePort: 30883
