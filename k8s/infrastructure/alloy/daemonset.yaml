apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: alloy
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
      annotations:
        # Alloy doesn't reload config.alloy on its own: bump this when the
        # ConfigMap changes so the DaemonSet rolls through GitOps.
        nest.arishaig.site/config-rev: "2026-10-11-redact-passwords"
    spec:
      serviceAccountName: alloy
      tolerations:
        - operator: Exists
      containers:
        - name: alloy
          image: grafana/alloy:v1.21.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy/data
          # Modest on purpose: this DaemonSet lands on every node, including
          # alpha-control (3.3Gi allocatable, control-plane pods only).
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 0
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: storage
          emptyDir: {}
