apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Helm chart sources. Lives under infrastructure (conceptually a cluster
  # primitive). The apps Kustomization now carries a dependsOn on
  # infrastructure (k8s/flux-system/apps.yaml, F3 in architecture-review.md),
  # so these sources are guaranteed to exist before any app HelmRelease
  # reconciles.
  - app-template.yaml
  - prometheus-community.yaml
  - watchback.yaml
  - nvidia.yaml
