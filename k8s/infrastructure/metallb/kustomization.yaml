apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Vendored, not fetched live (was a raw.githubusercontent.com URL) — kustomize
  # treats certain raw.githubusercontent.com URLs as git-repo references and
  # shells out to `git fetch` against them, which GitHub started blocking as
  # scraping (intermittent 429/404), breaking CI and Flux reconciliation alike.
  # metallb-native.yaml is pinned at v0.14.9, vendored verbatim via
  # `git clone --depth 1 --branch v0.14.9 https://github.com/metallb/metallb.git`
  # (a real git clone against github.com, not the broken raw-content pattern).
  # Not Renovate-tracked: a version bump here means re-running that clone and
  # replacing the file, not just editing a version string — no customManager
  # can do that part, so bumping this is a manual (or scripted) step.
  - metallb-native.yaml
  - ip-address-pool.yaml
  - l2advertisement.yaml

# All nodes are control planes, which carry the
# node.kubernetes.io/exclude-from-external-load-balancers label — without this
# flag the speaker refuses to announce L2 from any node and LB IPs never
# answer ARP on the LAN.
patches:
  - target:
      kind: DaemonSet
      name: speaker
      namespace: metallb-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --ignore-exclude-lb
