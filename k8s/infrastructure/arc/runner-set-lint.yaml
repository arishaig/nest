apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-lint
  namespace: arc-runners
spec:
  interval: 1h
  # CRDs (AutoscalingRunnerSet) ship with the controller chart — wait for it.
  dependsOn:
    - name: gha-runner-scale-set-controller
      namespace: arc-systems
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  values:
    # Install name == runner scale set name == the `runs-on:` label in
    # .github/workflows/lint.yml.
    runnerScaleSetName: arc-lint
    githubConfigUrl: https://github.com/arishaig/nest
    # Point the manager RoleBinding at the controller's ServiceAccount
    # explicitly instead of relying on the chart's in-cluster Deployment
    # discovery (by label app.kubernetes.io/part-of=gha-rs-controller). The
    # name is <controller release>-gha-rs-controller in arc-systems — exactly
    # what discovery resolves to — so this is behaviour-preserving, removes a
    # runtime lookup, and lets the chart render offline for `flux-local test`.
    controllerServiceAccount:
      name: gha-runner-scale-set-controller-gha-rs-controller
      namespace: arc-systems
    # Pre-existing secret (key: github_token) created by
    # playbooks/provision/k8s.yml from vault_github_runner_pat.
    githubConfigSecret: arc-github-secret
    # Scale to zero when idle; burst up to 8 concurrent lint jobs.
    #
    # Was 16. Lowered after the 2026-07-31 incident: four PR merges landed
    # within ~3 minutes, each fanning out to ~11 lint jobs, which queued 21
    # runner pods at once on the single schedulable amd64 node (talos-a2c-1b8)
    # — the same node carrying every media workload. That contention spilled
    # over to the Proxmox host (load average 20/45/50 on 12 cores) and starved
    # talos-alpha-control (2 vCPU) enough to crash-loop kube-scheduler and
    # kube-controller-manager. 8 is a real cap on burst size, not just a
    # cosmetic reduction from 16. Paired with lint.yml's concurrency group
    # (cancels superseded runs from stacked merges) and the CPU limit and
    # priorityClassName below (bounds and deprioritizes what does run).
    minRunners: 0
    maxRunners: 8
    # No lint job builds images, so default (non-dind) containerMode stays.
    template:
      spec:
        # ghcr.io/arishaig/nest-ci-runner is amd64-only (single-platform
        # image, no arm64 variant). beta-rpi5 became a general-purpose
        # schedulable worker as of the control-plane migration (2026-07-20,
        # Phase 2) — before that, both RPi5 nodes were control-plane-only
        # (NoSchedule) so this never mattered. Without this, roughly half of
        # ephemeral runner pods land on the arm64 node and fail immediately
        # ("exec format error"), which looked like ARC being "stuck" (churning
        # pods, queued jobs never completing) rather than a scheduling bug.
        nodeSelector:
          kubernetes.io/arch: amd64
        # Lower priority than any pod that doesn't specify a class (default
        # 0) — see priorityclass.yaml. Under scheduling pressure, real
        # workloads win the slot, not a lint job; these never preempt anything
        # to get one.
        priorityClassName: ci-runner-low
        containers:
          - name: runner
            image: ghcr.io/arishaig/nest-ci-runner:latest
            command: ["/home/runner/run.sh"]
            # Lint jobs are short (≤~40s) and light, so requests are tiny: a
            # dozen-plus fit on alpha (the only schedulable amd64 node), which
            # has ~790m CPU free after existing workloads (12 × 50m = 600m).
            #
            # cpu limit added 2026-07-31: the previous "no CPU limit, they
            # merely contend, never failing" assumption is what let a burst of
            # these pods peg the VM's vCPUs hard enough to starve the
            # neighboring talos-alpha-control VM at the Proxmox host level —
            # a k8s-level PriorityClass has no reach there, since it's below
            # the node/VM boundary. 300m caps a single runner's burst to
            # 6x its request; at the new maxRunners: 8 cap, worst case is
            # 2.4 cores of burst instead of unbounded.
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 1Gi
