apiVersion: v1
kind: ServiceAccount
metadata:
  name: dead-pod-cleanup
  namespace: kube-system
---
# Cluster-wide: dead pods turn up in every namespace (media, gpu-operator,
# nfs-provisioner, ... after the 2026-09-24 reboot). Pods only, and only
# get/list/delete; what actually gets deleted is narrowed by the script.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dead-pod-cleanup
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dead-pod-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dead-pod-cleanup
subjects:
  - kind: ServiceAccount
    name: dead-pod-cleanup
    namespace: kube-system
