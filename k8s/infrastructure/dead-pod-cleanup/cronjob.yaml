# Deletes dead ReplicaSet pods. When a node shuts down or restarts, kubelet
# terminates its pods and leaves them behind as Failed or Succeeded. The
# ReplicaSet has already replaced them, but the objects never go away: the
# controller-manager's pod GC only starts at 12500 terminated pods. They sit
# in `kubectl get pods`, and Failed ones fire KubePodNotReady until someone
# deletes them by hand (e.g. 12 Failed + 66 Succeeded after the 2026-09-24
# PVE reboot).
#
# Scope is deliberately narrow:
#   - ReplicaSet-owned only. DaemonSet and StatefulSet controllers delete
#     their own failed pods, static-pod mirrors belong to kubelet, Job pods
#     are the Job's history (history limits and TTL), and bare pods are left
#     for a human.
#   - Dead for at least an hour, measured from the Ready condition's last
#     transition (when the pod stopped), not its creation. That keeps the
#     pod around long enough for KubePodEvicted (for: 15m) to see it and for
#     someone to look at it. Pods with no Ready condition are skipped.
#   - Pods already being deleted are skipped.
# Every deletion is logged (reason, node, when it stopped), so Loki keeps a
# record after the object is gone.
#
# The image is the same one flannel-watchdog runs, which is proven
# multi-arch on this cluster (no nodeSelector needed).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dead-pod-cleanup
  namespace: kube-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dead-pod-cleanup
        spec:
          serviceAccountName: dead-pod-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: cleanup
              image: alpine/kubectl:1.37.0
              env:
                # kubectl's discovery cache needs a writable home.
                - name: HOME
                  value: /tmp
                - name: GRACE_SECONDS
                  value: "3600"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              command:
                - /bin/sh
                - -euc
                - |
                  # UTC ISO-8601 timestamps sort correctly as plain strings,
                  # so the age check is a string comparison in awk.
                  cutoff=$(date -u -d "@$(( $(date +%s) - GRACE_SECONDS ))" +%Y-%m-%dT%H:%M:%SZ)
                  # Fields: ns|name|phase|owner kind|deletionTimestamp|node|
                  #         DisruptionTarget reason|Ready lastTransitionTime
                  # '|'-delimited so empty fields don't shift the columns.
                  kubectl get pods -A \
                    --field-selector=status.phase!=Running,status.phase!=Pending \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}|{.metadata.name}|{.status.phase}|{.metadata.ownerReferences[0].kind}|{.metadata.deletionTimestamp}|{.spec.nodeName}|{range .status.conditions[?(@.type=="DisruptionTarget")]}{.reason}{end}|{range .status.conditions[?(@.type=="Ready")]}{.lastTransitionTime}{end}{"\n"}{end}' \
                    > /tmp/pods
                  awk -F'|' -v cutoff="$cutoff" \
                    '($3 == "Failed" || $3 == "Succeeded") && $4 == "ReplicaSet" && $5 == "" && $8 != "" && $8 < cutoff' \
                    /tmp/pods > /tmp/dead
                  echo "dead-pod-cleanup: $(wc -l < /tmp/dead) dead ReplicaSet pod(s) stopped before ${cutoff}"
                  while IFS='|' read -r ns name phase _owner _deleting node reason stopped; do
                    echo "deleting ${ns}/${name} phase=${phase} reason=${reason:-none} node=${node:-none} stopped=${stopped}"
                    kubectl delete pod -n "$ns" "$name" --wait=false \
                      || echo "failed to delete ${ns}/${name}"
                  done < /tmp/dead
              resources:
                requests:
                  cpu: 5m
                  memory: 32Mi
                limits:
                  memory: 96Mi
