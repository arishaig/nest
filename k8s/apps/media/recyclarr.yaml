apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: "0 */6 * * *"
          concurrencyPolicy: Forbid
        pod:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/recyclarr/recyclarr
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.3
            args: ["sync"]
            env:
              TZ: America/Los_Angeles
              # Read by !env_var in the ConfigMap (recyclarr-configmap.yaml).
              SONARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-api-key
                    key: APIKEY
              RADARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-api-key
                    key: APIKEY
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: recyclarr-config
        advancedMounts:
          recyclarr:
            app:
              - path: /config
      # The config is owned by git. Mounted over the single file the old PVC
      # copy lived at (the PVC stays for cache/state/repositories).
      recyclarr-yml:
        type: configMap
        name: recyclarr-config-yml
        advancedMounts:
          recyclarr:
            app:
              - path: /config/configs/recyclarr.yml
                subPath: recyclarr.yml
                readOnly: true
