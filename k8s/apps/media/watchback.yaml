apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: watchback
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: watchback
      # renovate: datasource=docker depName=ghcr.io/arishaig/watchback
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: watchback
        namespace: flux-system
  values:
    service:
      type: ClusterIP
      port: 8484
    persistence:
      existingClaim: watchback-data
      subPath: data
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
