# TEMPORARY spike (remove after use): throwaway Jellyfin on omega with NVENC
# enabled, used only to capture real ffmpeg command lines for the
# rffmpeg/arg-rewriter design (offload Jellyfin transcodes to omega with
# software fallback on alpha). Not wired into ingress, so it is reachable
# only via `kubectl port-forward`.
#
# Wired like the live Jellyfin will be (JELLYFIN_FFMPEG -> offload wrapper,
# shared transcode/subtitle volume, runner token) so the omega offload can be
# tested end to end first. See docs/jellyfin-offload.md.
#
# Isolated from the real Jellyfin: official sqlite image (no POSTGRES_*
# env, so it can never touch the shared `jellyfin` DB), config/cache on
# emptyDir, media mounted read-only. The sole shared resource is the spare
# GPU time-slice on omega.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-spike
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin-spike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin-spike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-spike
    spec:
      # CDI isn't the cluster default; without this the pod schedules but
      # gets no GPU (see tdarr-node.yaml).
      runtimeClassName: nvidia
      tolerations:
        - key: nest.arishaig.site/workloads
          operator: Equal
          value: omega
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [omega]
      containers:
        - name: jellyfin
          # Same major.minor as the live jpvenson/jellyfin.pgsql:12.1-2 fork,
          # so the generated ffmpeg arguments match production's.
          # renovate: datasource=docker depName=ghcr.io/jellyfin/jellyfin
          image: ghcr.io/jellyfin/jellyfin:12.1.20260915-010956
          env:
            - name: TZ
              value: America/Los_Angeles
            # Route every ffmpeg call through the offload wrapper, exactly as
            # the live Jellyfin will be wired (docs/jellyfin-offload.md).
            - name: JELLYFIN_FFMPEG
              value: /offload/ffmpeg
            - name: FFMPEG_RUNNER_HOST
              value: jellyfin-ffmpeg-runner
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            # "video" is what exposes NVENC/NVDEC to ffmpeg.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,video
          ports:
            - name: http
              containerPort: 8096
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "1"
            limits:
              memory: 4Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /data
              readOnly: true
            - name: offload-scripts
              mountPath: /offload
            - name: offload-secret
              mountPath: /offload-secret
              readOnly: true
            # Same shared paths as the runner on omega.
            - name: shared
              mountPath: /config/cache/transcodes
              subPath: transcodes
            - name: shared
              mountPath: /config/data/subtitles
              subPath: subtitles
            - name: shared
              mountPath: /config/data/attachments
              subPath: attachments
      volumes:
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
            readOnly: true
        - name: offload-scripts
          configMap:
            name: jellyfin-offload-scripts
            defaultMode: 0755
        - name: offload-secret
          secret:
            secretName: jellyfin-ffmpeg-runner
        - name: shared
          persistentVolumeClaim:
            claimName: jellyfin-shared
