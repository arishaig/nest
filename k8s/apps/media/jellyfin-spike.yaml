# TEMPORARY spike (remove after use): throwaway Jellyfin with NVENC
# enabled, used only to capture real ffmpeg command lines for the
# ffmpeg wrapper/arg-rewriter design (offload Jellyfin transcodes to omega
# with software fallback on alpha). Not wired into ingress, so it is reachable
# only via `kubectl port-forward`.
#
# Wired like the live Jellyfin will be (JELLYFIN_FFMPEG -> offload wrapper,
# shared transcode/subtitle volume, runner token) so the omega offload can be
# tested end to end first. See docs/jellyfin-offload.md.
#
# Isolated from the real Jellyfin: official sqlite image (no POSTGRES_*
# env, so it can never touch the shared `jellyfin` DB), config/cache on
# emptyDir, media mounted read-only. It shares alpha's CPU with the live
# Jellyfin, hence the CPU limit below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-spike
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin-spike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin-spike
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-spike
    spec:
      # Runs on alpha, NOT omega: this reproduces what the live Jellyfin
      # sees (NVENC configured, no GPU on the host) so the ffmpeg wrapper and
      # CPU-fallback rewriter can be tested without touching production.
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: NotIn
                    values: [omega]
      containers:
        - name: jellyfin
          # Same major.minor as the live jpvenson/jellyfin.pgsql:12.1-2 fork,
          # so the generated ffmpeg arguments match production's.
          # renovate: datasource=docker depName=ghcr.io/jellyfin/jellyfin
          image: ghcr.io/jellyfin/jellyfin:12.1.20260915-010956
          env:
            - name: TZ
              value: America/Los_Angeles
            # Route every ffmpeg call through the offload wrapper, exactly as
            # the live Jellyfin will be wired (docs/jellyfin-offload.md).
            - name: JELLYFIN_FFMPEG
              value: /offload/ffmpeg
            - name: FFMPEG_RUNNER_HOST
              value: jellyfin-ffmpeg-runner
          ports:
            - name: http
              containerPort: 8096
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            # CPU capped so a CPU-fallback transcode test can't starve the
            # live Jellyfin that shares alpha.
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /data
              readOnly: true
            - name: offload-scripts
              mountPath: /offload
            - name: offload-secret
              mountPath: /offload-secret
              readOnly: true
            # Same shared paths as the runner on omega.
            - name: shared
              mountPath: /config/cache/transcodes
              subPath: transcodes
            - name: shared
              mountPath: /config/data/subtitles
              subPath: subtitles
            - name: shared
              mountPath: /config/data/attachments
              subPath: attachments
      volumes:
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
        - name: media
          persistentVolumeClaim:
            claimName: media-nfs
            readOnly: true
        - name: offload-scripts
          configMap:
            name: jellyfin-offload-scripts
            defaultMode: 493  # 0755 (decimal: yamllint forbids implicit octal)
        - name: offload-secret
          secret:
            secretName: jellyfin-ffmpeg-runner
        - name: shared
          persistentVolumeClaim:
            claimName: jellyfin-scratch
