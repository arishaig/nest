apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Renamed from jellyfin-pgsql — this is the Jellyfin server (jpvenson's
  # postgres-backed build from the sqlite->postgres migration), not a database.
  # The config PVC keeps its original jellyfin-pgsql-config name: it's bound
  # to live data and renaming a PVC means migrating the volume.
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Prefer alpha (nest.arishaig.site/workloads=general). Soft so it can
    # still reschedule if alpha is unavailable (delta is gone; the old "2Gi
    # fits delta" sizing rationale went with it).
    #
    # Hard amd64 pin: ghcr.io/jpvenson/jellyfin.pgsql has no arm64 build. Before
    # beta-rpi5/gamma-rpi5 became schedulable workers, this never mattered
    # (soft alpha preference always won since nothing else existed); once
    # RPi5 nodes joined as workers (2026-07 control-plane migration), an
    # alpha drain (or just scheduler luck) can land it on an arm64 node,
    # where it sits in permanent ImagePullBackOff. Hit exactly this
    # 2026-07-22 after alpha's Phase 4 drain/rejoin. Same fix already applied
    # to tunarr/watchback for the same reason.
    #
    # Hard exclusion from omega (the gaming-PC GPU node, talos/patches/worker-omega.yaml):
    # amd64 alone isn't enough to keep Jellyfin off it (omega is amd64 too).
    # Jellyfin is user-facing and must never land on a node that's routinely
    # offline for hours at a time — unlike the other media workloads, this
    # one is not reschedule-tolerant by design choice, not an oversight.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general]
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: NotIn
                    values: [omega]
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      jellyfin:
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/jpvenson/jellyfin.pgsql
              repository: ghcr.io/jpvenson/jellyfin.pgsql
              # Digest-pinned: the fork re-tags quickly, and every bump needs the
              # offline rehearsal in docs/jellyfin-upgrades.md against this exact image.
              tag: 12.1-2@sha256:b1cafefc4732895b9bece7da1787690aa462ee2e46e968b99c735754d95c785d
            env:
              # Library DB lives in the shared `postgres` service (DB: jellyfin),
              # not a bundled instance — despite the image name. Connects as its
              # own `jellyfin` role (DB owner, not superuser), not Mealie's.
              POSTGRES_HOST: postgres
              POSTGRES_PORT: "5432"
              POSTGRES_DB: jellyfin
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: jellyfin-postgres-secret
                    key: POSTGRES_USER
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: jellyfin-postgres-secret
                    key: POSTGRES_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Upgrades run DB migrations before /health answers (20 s for
              # 12.1 in rehearsal, more if the stale-file cleanup deletes items).
              # Liveness killing the pod mid-migration skips the plugin's restore,
              # so give startup up to 15 min before liveness takes over.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            # 4Gi: the 2Gi limit OOM-killed Jellyfin repeatedly during evening
            # streaming (3× on 2026-07-07 alone) — this is the Jellyfin server
            # itself despite the pgsql name, and transcode/stream buffers spike
            # past 2Gi under concurrent use.
            # 6Gi: MediaDash runs its x265 re-encode fixes as ffmpeg children
            # inside this cgroup (~0.6-1.1Gi each); 6-8 of them in parallel
            # OOM-killed the whole pod 10× between 2026-09-30 and 10-02. Keep
            # MediaDash's fix concurrency low too — the limit alone won't
            # hold 8 parallel encodes.
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
    service:
      app:
        controller: jellyfin
        type: ClusterIP
        ports:
          http:
            port: 8096
            targetPort: 8096
    persistence:
      config:
        existingClaim: jellyfin-pgsql-config
        advancedMounts:
          jellyfin:
            app:
              - path: /config
      media:
        existingClaim: media-nfs
        advancedMounts:
          jellyfin:
            app:
              # Read-write (was readOnly: true, a deliberate "media server must
              # not mutate the library" boundary). Opened up on request so the
              # MediaDash plugin, which runs in-process, can apply its fixes —
              # trickplay re-encode, .nfo/artwork rewrites, and file
              # moves/deletes for its Duplicate/Playability/Transcode fixers.
              # Trade-off: MediaDash can now move and permanently delete real
              # media files. Keep its Automatic FixModes and any *Disposal:
              # Permanent modes in check via the plugin UI — a re-detection
              # loop here churns the library itself, not just cache tiles.
              - path: /data
