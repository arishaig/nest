apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Renamed from jellyfin-pgsql — this is the Jellyfin server (our fork of jpvenson's
  # postgres-backed build from the sqlite->postgres migration), not a database.
  # The config PVC keeps its original jellyfin-pgsql-config name: it's bound
  # to live data and renaming a PVC means migrating the volume.
  name: jellyfin
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Prefer alpha (nest.arishaig.site/workloads=general). Soft so it can
    # still reschedule if alpha is unavailable (delta is gone; the old "2Gi
    # fits delta" sizing rationale went with it).
    #
    # Hard amd64 pin: ghcr.io/arishaig/jellyfin.pgsql has no arm64 build. Before
    # beta-rpi5/gamma-rpi5 became schedulable workers, this never mattered
    # (soft alpha preference always won since nothing else existed); once
    # RPi5 nodes joined as workers (2026-07 control-plane migration), an
    # alpha drain (or just scheduler luck) can land it on an arm64 node,
    # where it sits in permanent ImagePullBackOff. Hit exactly this
    # 2026-07-22 after alpha's Phase 4 drain/rejoin. Same fix already applied
    # to tunarr/watchback for the same reason.
    #
    # Hard exclusion from omega (the gaming-PC GPU node, talos/patches/worker-omega.yaml):
    # amd64 alone isn't enough to keep Jellyfin off it (omega is amd64 too).
    # Jellyfin is user-facing and must never land on a node that's routinely
    # offline for hours at a time — unlike the other media workloads, this
    # one is not reschedule-tolerant by design choice, not an oversight.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general]
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: NotIn
                    values: [omega]
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      jellyfin:
        strategy: Recreate
        # Installs the git-tracked encoding.xml before Jellyfin starts, every start,
        # so the transcode settings follow the pod across nodes and survive a
        # restored/blank config volume. Overwrites the file on purpose: the
        # ConfigMap (k8s/apps/media/jellyfin-config/encoding.xml) is the source of
        # truth, and Dashboard > Playback edits last until the next restart.
        # Copy + rename so Jellyfin never sees a half-written file.
        initContainers:
          encoding-xml:
            image:
              repository: busybox
              tag: stable
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /config/config
                cp /encoding-config/encoding.xml /config/config/encoding.xml.tmp
                mv /config/config/encoding.xml.tmp /config/config/encoding.xml
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/arishaig/jellyfin.pgsql
              repository: ghcr.io/arishaig/jellyfin.pgsql
              # Digest-pinned: the fork re-tags quickly, and every bump needs the
              # offline rehearsal in docs/jellyfin-upgrades.md against this exact image.
              tag: 12.3-1@sha256:4347d318ee1d5dcc2677a4c72f0d2cdf63859a857c5ce803e537e43042887619
            env:
              # Library DB lives in the shared `postgres` service (DB: jellyfin),
              # not a bundled instance — despite the image name. Connects as its
              # own `jellyfin` role (DB owner, not superuser), not Mealie's.
              POSTGRES_HOST: postgres
              POSTGRES_PORT: "5432"
              POSTGRES_DB: jellyfin
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: jellyfin-postgres-secret
                    key: POSTGRES_USER
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: jellyfin-postgres-secret
                    key: POSTGRES_PASSWORD
              # ffmpeg goes through the omega offload wrapper (docs/jellyfin-offload.md).
              # Playback transcodes are NVENC command lines (encoding.xml, applied
              # by the encoding-xml initContainer): omega runs them when it is up,
              # otherwise the wrapper rewrites them for alpha's CPU. Trickplay runs
              # on omega only (and fails fast, exit 98, when omega is down); calls
              # with no GPU arguments run the real ffmpeg locally, unchanged.
              # Kill switch: OFFLOAD_DISABLED=1 (trickplay then fails fast too).
              JELLYFIN_FFMPEG: /offload/ffmpeg
              FFMPEG_RUNNER_HOST: jellyfin-ffmpeg-runner
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Upgrades run DB migrations before /health answers (20 s for
              # 12.1 in rehearsal, more if the stale-file cleanup deletes items).
              # Liveness killing the pod mid-migration skips the plugin's restore,
              # so give startup up to 15 min before liveness takes over.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 90
            # 4Gi: the 2Gi limit OOM-killed Jellyfin repeatedly during evening
            # streaming (3× on 2026-07-07 alone) — this is the Jellyfin server
            # itself despite the pgsql name, and transcode/stream buffers spike
            # past 2Gi under concurrent use.
            # 6Gi: MediaDash runs its x265 re-encode fixes as ffmpeg children
            # inside this cgroup (~0.6-1.1Gi each); 6-8 of them in parallel
            # OOM-killed the whole pod 10× between 2026-09-30 and 10-02. Keep
            # MediaDash's fix concurrency low too — the limit alone won't
            # hold 8 parallel encodes.
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 6Gi
    service:
      app:
        controller: jellyfin
        type: ClusterIP
        ports:
          http:
            port: 8096
            targetPort: 8096
    persistence:
      config:
        existingClaim: jellyfin-pgsql-config
        advancedMounts:
          jellyfin:
            app:
              - path: /config
            encoding-xml:
              - path: /config
      encoding-config:
        type: configMap
        name: jellyfin-encoding-config
        advancedMounts:
          jellyfin:
            encoding-xml:
              - path: /encoding-config
                readOnly: true
      offload-scripts:
        type: configMap
        name: jellyfin-offload-scripts
        defaultMode: 493  # 0755 (decimal: yamllint forbids implicit octal)
        advancedMounts:
          jellyfin:
            app:
              - path: /offload
      offload-secret:
        type: secret
        name: jellyfin-ffmpeg-runner
        advancedMounts:
          jellyfin:
            app:
              - path: /offload-secret
                readOnly: true
      # Shared with the runner on omega at the same absolute paths, because
      # Jellyfin writes absolute /config/... paths into ffmpeg command lines.
      # transcodes/ also carries trickplay thumbnails: omega writes them here and
      # the wrapper moves them into /tmp/jellyfin. subtitles/ and attachments/
      # are what NVENC transcodes read (burned-in subtitles, fonts); these mounts
      # hide the copies on the config PVC, so seed the shared volume first or the
      # first play of each file re-extracts them (docs/jellyfin-offload.md, Rollout).
      scratch:
        existingClaim: jellyfin-scratch
        advancedMounts:
          jellyfin:
            app:
              - path: /config/cache/transcodes
                subPath: transcodes
              - path: /config/data/subtitles
                subPath: subtitles
              - path: /config/data/attachments
                subPath: attachments
      media:
        existingClaim: media-nfs
        advancedMounts:
          jellyfin:
            app:
              # Read-write (was readOnly: true, a deliberate "media server must
              # not mutate the library" boundary). Opened up on request so the
              # MediaDash plugin, which runs in-process, can apply its fixes —
              # trickplay re-encode, .nfo/artwork rewrites, and file
              # moves/deletes for its Duplicate/Playability/Transcode fixers.
              # Trade-off: MediaDash can now move and permanently delete real
              # media files. Keep its Automatic FixModes and any *Disposal:
              # Permanent modes in check via the plugin UI — a re-detection
              # loop here churns the library itself, not just cache tiles.
              - path: /data
