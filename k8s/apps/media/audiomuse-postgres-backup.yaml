apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiomuse-postgres-backup
  namespace: media
spec:
  interval: 1h
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Logical dump of audiomuse-postgres (its own Postgres 15, not the shared
    # instance covered by postgres-backup.yaml). pbs-k8s-configs-backup copies
    # rpool/data/k8s-configs file by file with no snapshot, so its copy of the
    # live PGDATA isn't guaranteed to restore. The dump lands in the same PVC
    # (outside PGDATA) at 02:40, so the 03:00 run picks up a consistent copy.
    # Pinned to alpha alongside audiomuse: audiomuse-data is RWO.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general]
    controllers:
      audiomuse-postgres-backup:
        type: cronjob
        cronjob:
          schedule: "40 2 * * *"
          timeZone: America/Los_Angeles
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
        pod:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsGroup: 999
        containers:
          app:
            image:
              # Must match the server major (audiomuse.yaml pins 15).
              # renovate: datasource=docker depName=postgres
              repository: postgres
              tag: "15.19"
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                root=/backup/backups
                dir="$root/$(date +%Y%m%d-%H%M%S)"
                mkdir -p "$dir"
                pg_dump -Fc -d audiomusedb -f "$dir/audiomusedb.dump"
                # Fails the job if the archive is unreadable.
                pg_restore -l "$dir/audiomusedb.dump" > /dev/null
                touch "$dir/COMPLETE"
                find "$root" -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} +
                ls -la "$dir"
            env:
              PGHOST: audiomuse-postgres
              PGUSER: audiomuse
              PGDATABASE: audiomusedb
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: audiomuse-secret
                    key: POSTGRES_PASSWORD
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        enabled: false
    persistence:
      backup:
        existingClaim: audiomuse-data
        advancedMounts:
          audiomuse-postgres-backup:
            app:
              - path: /backup
