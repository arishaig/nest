# Placement (A3 in architecture-review.md): sabnzbd/subgen/
# tdarr-node/postgres are hard-pinned to alpha for memory, sonarr for
# SQLite-on-NFS stalls on the RPi5s; jellyfin/tunarr/watchback
# carry amd64 nodeSelectors they genuinely need; the other *arrs +
# mealie + postgres-exporter carry a soft nest.arishaig.site/workloads=general
# preference toward alpha. Everything else here (copyparty, flaresolverr,
# homepage, lidarr-ui, medialyze, metube, recyclarr, watcharr, recommendarr,
# storyteller) is intentionally left unconstrained rather than guessed at —
# none are known to need arm64 exclusion, but placing them onto the RPi5s
# (nest.arishaig.site/workloads=rpi5, currently unused by any preference)
# is unverified and left for a dedicated pass, not this fix.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - media-nfs-pv.yaml
  - media-nfs-pvc.yaml
  # --- *arr stack ---
  - lidarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - lidarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - lidarr-ui.yaml  # HelmRelease (app-template) — replaces deployment+service
  - bazarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - bazarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  # bazarr-sync-job.yaml is intentionally NOT here — manual one-shot Job (TTL self-cleans)
  - subgen-models-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - subgen-decode-patch.yaml  # kept raw — HelmRelease mounts via persistence
  - subgen.yaml  # HelmRelease (app-template) — replaces deployment+service
  - subgen-ui-rbac.yaml  # kept raw — HelmRelease binds the ServiceAccount by name
  - subgen-ui.yaml  # HelmRelease (app-template) — status page + stop/start/restart for subgen
  - prowlarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - prowlarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - sonarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - sonarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - radarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - radarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - flaresolverr.yaml  # HelmRelease (app-template) — replaces deployment+service
  # --- download clients ---
  - sabnzbd-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - sabnzbd.yaml  # HelmRelease (app-template) — replaces deployment+service
  - recyclarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - recyclarr-configmap.yaml  # kept raw — HelmRelease mounts it via persistence (config as code)
  - recyclarr.yaml  # HelmRelease (app-template) — replaces cronjob
  # --- request management ---
  - seerr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - seerr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - recommendarr-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - recommendarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  # --- media servers / tools ---
  - tunarr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - tunarr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - dispatcharr-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - dispatcharr.yaml  # HelmRelease (app-template) — FAST-channel M3U/XMLTV proxy for Jellyfin Live TV
  - pluto-proxy.yaml  # HelmRelease (app-template) — Pluto TV playlist/stream redirector feeding Dispatcharr
  - metube.yaml  # HelmRelease (app-template) — replaces deployment+service (no PVC; uses media-nfs)
  - medialyze-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - medialyze.yaml  # HelmRelease (app-template) — replaces deployment+service
  - storyteller-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - storyteller.yaml  # HelmRelease (app-template) — replaces deployment+service
  - kiwix.yaml  # HelmRelease (app-template) — kiwix-serve + monthly ZIM sync CronJob (no PVC; uses media-nfs)
  # --- digarr (AI music discovery, discovery-only trial; docs/music-digarr.md) ---
  - digarr-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - digarr.yaml  # HelmRelease (app-template)
  # --- tracking / watchlists ---
  - watcharr-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - watcharr.yaml  # HelmRelease (app-template) — replaces deployment+service
  - watchback-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - watchback.yaml  # HelmRelease (app-template) — replaces deployment+service
  # --- dashboard ---
  - homepage-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - homepage.yaml  # HelmRelease (app-template) — replaces deployment+service
  # --- file access ---
  - copyparty-config-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - copyparty.yaml  # HelmRelease (app-template) — replaces deployment+service
  # --- mealie + database ---
  - postgres-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - postgres.yaml  # HelmRelease (app-template) — replaces deployment+service
  - postgres-backup.yaml  # HelmRelease (app-template) — nightly pg_dump into postgres-data
  - postgres-exporter.yaml  # HelmRelease (app-template) — replaces deployment+service
  - mealie-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - mealie.yaml  # HelmRelease (app-template) — replaces deployment+service
  # --- tdarr server + node ---
  - tdarr-pvc.yaml  # kept raw (data safety) — both HelmReleases bind via existingClaim (shared)
  - tdarr.yaml  # HelmRelease (app-template) — replaces tdarr-server deployment+service
  - tdarr-node.yaml  # HelmRelease (app-template) — replaces tdarr-node deployment (no service)
  - shrink-remux.yaml  # suspended CronJob — on-demand GPU shrink of 1080p SDR TV remuxes (script via the generator below)
  # --- jellyfin (postgres backend; primary instance at jellyfin.arishaig.site) ---
  - jellyfin-pgsql-config-pvc.yaml  # kept raw (data safety) — PVC keeps legacy name, bound to live data
  - jellyfin.yaml  # HelmRelease (app-template) — renamed from jellyfin-pgsql (it's the Jellyfin server)
  - jellyfin-spike.yaml  # TEMPORARY throwaway NVENC Jellyfin on omega (ffmpeg arg capture) — remove after spike
  - jellyfin-scratch-nfs.yaml  # static RWX PV+PVC shared by Jellyfin and the omega ffmpeg runner (NFS lookup-cache options)
  - jellyfin-ffmpeg-runner.yaml  # HelmRelease (app-template) — GPU ffmpeg runner on omega (docs/jellyfin-offload.md)
  # --- ollama (local LLM inference, GPU; backs CutScript's AI features) ---
  - ollama-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - ollama.yaml  # HelmRelease (app-template)
  # --- audiomuse (sonic analysis / Jellyfin Instant Mix; docs/music-audiomuse.md) ---
  - audiomuse-data-pvc.yaml  # kept raw (data safety) — HelmRelease binds via existingClaim
  - audiomuse.yaml  # HelmRelease (app-template) — flask + worker + postgres
  - ingress-routes.yaml
  - postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - jellyfin-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - prowlarr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - radarr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - sonarr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - bazarr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - dispatcharr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - seerr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - lidarr-postgres-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - lidarr-api-key.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - bazarr-api-key.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - digarr-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - prowlarr-api-key.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - audiomuse-secret.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - subgen-secrets.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - sonarr-api-key.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - radarr-api-key.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh
  - jellyfin-ffmpeg-runner.sops.yaml  # SOPS-encrypted; generated by scripts/render-k8s-secrets.sh

# Self-heal transient install/upgrade failures (e.g. helm-controller client
# rate-limiting during a large reconcile burst). Applies to every HelmRelease
# in this kustomization so individual files stay clean.
configMapGenerator:
  # Wrapper + runner + CPU-fallback rewriter. The wrapper is published as
  # `ffmpeg` so JELLYFIN_FFMPEG can point at a directory that also holds the
  # ffprobe shim (Jellyfin finds ffprobe next to ffmpeg). No name hash, so a
  # script change needs a rollout of the runner (and Jellyfin) to take effect.
  - name: jellyfin-offload-scripts
    namespace: media
    files:
      - ffmpeg=jellyfin-offload/ffmpeg-wrapper.pl
      - ffprobe=jellyfin-offload/ffprobe
      - ffmpeg-sw-fallback.pl=jellyfin-offload/ffmpeg-sw-fallback.pl
      - ffmpeg-runner.pl=jellyfin-offload/ffmpeg-runner.pl
  # Stdlib-only Pluto TV playlist helper (docs/live-tv.md); no name hash, so a
  # script change needs a rollout of the pluto-proxy pod to take effect.
  - name: pluto-proxy-script
    namespace: media
    files:
      - pluto-proxy/pluto_proxy.py
  - name: shrink-remux-script
    namespace: media
    files:
      - shrink-remux/shrink-remux.sh
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target:
      kind: HelmRelease
    patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: all
      spec:
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
