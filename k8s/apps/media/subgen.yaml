apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subgen
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # All probes are disabled below (no health endpoint), so Helm has nothing
  # meaningful to wait on for readiness. With strategy: Recreate, a single
  # OOM/crash during the recreate window used to stall the upgrade for the
  # full 5m wait, burning through remediation retries before the new pod
  # spec (e.g. the memory limit) ever got applied.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    # Pinned to omega (talos-omega, the gaming PC's RTX 3080) — GPU-accelerated
    # transcription is the whole reason that node was onboarded. Reschedule-
    # tolerant by design: whenever the owner reboots into Windows, subgen just
    # sits pending until omega rejoins (see KubeNodeNotReady exclusion for
    # omega in the Prometheus rules — expected downtime, not an incident).
    defaultPodOptions:
      # CDI isn't the cluster default (gpu-operator ClusterPolicy has
      # cdi.default: false) — confirmed against the working
      # nvidia-cuda-validator pod, which sets this explicitly. Without it the
      # pod schedules fine (nvidia.com/gpu is just a resource count) but gets
      # no actual GPU device — a runtime failure invisible to kustomize/CI.
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [omega]
    controllers:
      subgen:
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
        containers:
          app:
            image:
              # renovate: datasource=docker depName=mccloud/subgen versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
              # No -cpu suffix: the default/latest-tagged image is the one
              # with CUDA support built in (mccloud/subgen docs) — the -cpu
              # variant used before omega existed can't use the GPU at all.
              repository: mccloud/subgen
              tag: 2026.07.3
            env:
              WEBHOOK_PORT: "9000"
              # large-v3, not large-v3-turbo: turbo doesn't support
              # TRANSCRIBE_OR_TRANSLATE=translate below. Live-checked VRAM
              # headroom via `nvidia-smi` on omega before bumping from
              # medium: two concurrent medium jobs used ~1.9GB of the
              # 3080's 10GB. COMPUTE_TYPE pinned to float16 (rather than
              # the "auto" default) to keep that budget deterministic.
              #
              # CONCURRENT_TRANSCRIPTIONS maps to CTranslate2's num_workers
              # on a single shared model instance (confirmed against
              # subgen's source, start_model() in subgen.py) — extra
              # workers add parallel inference replicas sharing the same
              # model weights, not full separate model copies, so the
              # marginal VRAM cost per worker is modest. Live-checked at
              # large-v3/2 workers: ~4.8GB/10.24GB used, ~5GB free — bumped
              # to 3 with that headroom. tdarr-node isn't consuming GPU
              # concurrently as of this change (its GPU wiring hasn't been
              # picked up by Flux yet); re-check nvidia-smi once it lands.
              WHISPER_MODEL: large-v3
              COMPUTE_TYPE: float16
              WHISPER_THREADS: "4"
              NAMESUBLANG: en
              SKIP_ONLY_SUBGEN_SUBTITLES: "True"
              SKIP_IF_INTERNAL_SUBTITLES_LANGUAGE: ""
              DETECT_LANGUAGE_LENGTH: "30"
              DETECT_LANGUAGE_OFFSET: "60"
              SHOULD_WHISPER_DETECT_AUDIO_LANGUAGE: "True"
              TRANSCRIBE_OR_TRANSLATE: translate
              CONCURRENT_TRANSCRIPTIONS: "3"
              WORD_LEVEL_HIGHLIGHT: "False"
              DEBUG: "True"
              TRANSCRIBE_DEVICE: cuda
              SHOW_IN_SUBNAME_SUBGEN: "True"
              SHOW_IN_SUBNAME_MODEL: "True"
              MODEL_PATH: ./models
              UPDATE: "False"
              APPEND: "False"
              USE_MODEL_PROMPT: "False"
              CUSTOM_MODEL_PROMPT: ""
              LRC_FOR_AUDIO_FILES: "True"
              CUSTOM_REGROUP: "cm_sl=84_sl=42++++++1"
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: subgen-secrets
                    key: HF_TOKEN
            # subgen ran with no probes in the raw manifest — keep it that way
            # (webhook-driven worker, no health endpoint).
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            # nvidia.com/gpu in both requests and limits: the device plugin
            # requires them to match (it's an integer, non-overcommittable
            # resource) — this is also what actually gets subgen scheduled
            # onto omega and grants it access to the GPU device.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
                nvidia.com/gpu: "1"
              limits:
                memory: 8Gi
                nvidia.com/gpu: "1"
    service:
      app:
        controller: subgen
        ports:
          webhook:
            port: 9000
            targetPort: 9000
    persistence:
      models:
        existingClaim: subgen-models
        advancedMounts:
          subgen:
            app:
              - path: /subgen/models
      data:
        existingClaim: media-nfs
        advancedMounts:
          subgen:
            app:
              - path: /data
