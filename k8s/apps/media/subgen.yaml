apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subgen
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  # All probes are disabled below (no health endpoint), so Helm has nothing
  # meaningful to wait on for readiness. With strategy: Recreate, a single
  # OOM/crash during the recreate window used to stall the upgrade for the
  # full 5m wait, burning through remediation retries before the new pod
  # spec (e.g. the memory limit) ever got applied.
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    # Allowed on alpha (general) or omega (GPU node) — the 8Gi memory limit
    # (whisper models) exceeds beta/gamma rpi5 capacity (~3.5Gi allocatable),
    # so it must never schedule there. Prefer omega: it holds the only
    # nvidia.com/gpu in the cluster, so the GPU limit below already pins this
    # pod there in practice — the preference just makes that explicit and the
    # required term still keeps rpi5 excluded if the GPU limit is ever
    # dropped.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [omega]
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general, omega]
    controllers:
      subgen:
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
        containers:
          app:
            image:
              # renovate: datasource=docker depName=mccloud/subgen versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
              # Unsuffixed tag = CUDA build (the "-cpu" and "-amd" (ROCm)
              # suffixes are the other two variants) — confirmed against
              # Docker Hub image sizes: unsuffixed ~4.4GB vs -cpu ~580MB vs
              # -amd ~12.5GB. omega's GPU is an NVIDIA RTX 3080, so CUDA is
              # the correct variant, not the AMD/ROCm one.
              repository: mccloud/subgen
              tag: 2026.07.3
            env:
              WEBHOOK_PORT: "9000"
              WHISPER_MODEL: medium
              WHISPER_THREADS: "4"
              NAMESUBLANG: en
              SKIP_ONLY_SUBGEN_SUBTITLES: "True"
              SKIP_IF_INTERNAL_SUBTITLES_LANGUAGE: ""
              DETECT_LANGUAGE_LENGTH: "30"
              DETECT_LANGUAGE_OFFSET: "60"
              SHOULD_WHISPER_DETECT_AUDIO_LANGUAGE: "True"
              TRANSCRIBE_OR_TRANSLATE: translate
              CONCURRENT_TRANSCRIPTIONS: "2"
              WORD_LEVEL_HIGHLIGHT: "False"
              DEBUG: "True"
              TRANSCRIBE_DEVICE: cuda
              SHOW_IN_SUBNAME_SUBGEN: "True"
              SHOW_IN_SUBNAME_MODEL: "True"
              MODEL_PATH: ./models
              UPDATE: "False"
              APPEND: "False"
              USE_MODEL_PROMPT: "False"
              CUSTOM_MODEL_PROMPT: ""
              LRC_FOR_AUDIO_FILES: "True"
              CUSTOM_REGROUP: "cm_sl=84_sl=42++++++1"
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: subgen-secrets
                    key: HF_TOKEN
            # subgen ran with no probes in the raw manifest — keep it that way
            # (webhook-driven worker, no health endpoint).
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi
                nvidia.com/gpu: 1
    service:
      app:
        controller: subgen
        ports:
          webhook:
            port: 9000
            targetPort: 9000
    persistence:
      models:
        existingClaim: subgen-models
        advancedMounts:
          subgen:
            app:
              - path: /subgen/models
      data:
        existingClaim: media-nfs
        advancedMounts:
          subgen:
            app:
              - path: /data
