apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pluto-proxy
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field (see tunarr.yaml).
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Playlist + normalising HLS proxy for Pluto TV, feeding Dispatcharr
    # (docs/live-tv.md). Every segment passes through it (decrypt, copy-remux
    # to fixed PIDs, ads replaced by black/silent slates), so it is in the
    # video path: about 3 Mbit/s and one short ffmpeg run per 5 s segment per
    # stream. Script in the pluto-proxy-script ConfigMap (pluto-proxy/); no
    # state, nothing to back up.
    controllers:
      pluto-proxy:
        pod:
          annotations:
            # One-time roll so the self-reloading script is loaded; after that
            # the process re-execs by itself when its ConfigMap changes.
            nest.arishaig.site/script-revision: "2"
        containers:
          app:
            image:
              # ghcr.io/arishaig/pluto-proxy:latest — own CI image (pluto-proxy/
              # Dockerfile: python + Alpine's ffmpeg + GStreamer's closed-caption
              # elements), rolling tag, no
              # annotation. The GHCR package must be public, like nest-mcp's.
              repository: ghcr.io/arishaig/pluto-proxy
              tag: latest
              pullPolicy: Always
            command: [python, -I, /app/pluto_proxy.py]
            env:
              TZ: America/Los_Angeles
              PORT: "8181"
              PYTHONDONTWRITEBYTECODE: "1"
              PYTHONUNBUFFERED: "1"
              # Ad breaks are filled from clips here (one per break, looped);
              # empty folder = black. docs/live-tv.md "Ad-break clips".
              BREAKS_DIR: /breaks
              # Channels (Pluto ids, comma-separated, or "*") whose subtitles
              # are put into the video as closed captions (CEA-608), shown by
              # the player's CC setting. docs/live-tv.md "Closed captions".
              # "*": every channel (all 452 surveyed 2026-11-05 have subtitles;
              # 19 Spanish, labelled so).
              CC_CHANNELS: "*"
              # Same form: these also get a "<name> (CC)" twin in the playlist
              # with the captions drawn into the picture, for players that
              # can't show CEA-608 (Jellyfin never offers a caption track for
              # live TV). Re-encodes the show (~0.5 s CPU per 5 s segment).
              CC_BURN_CHANNELS: "5df97894467dfa00091c873c"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8181
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8181
                  periodSeconds: 30
                  timeoutSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              # ffmpeg/ffprobe run as subprocesses per segment, and a few
              # finished segments are kept per stream for repeat requests.
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # Cutting break clips is CPU work: prefer an amd64 node (about 4x a
      # Pi 5 per segment), never omega (a gaming PC that goes offline), and
      # still run on a Pi when alpha is unavailable.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [talos-omega]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [amd64]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        controller: pluto-proxy
        type: ClusterIP
        ports:
          http:
            port: 8181
            targetPort: 8181
    persistence:
      breaks:
        existingClaim: media-nfs
        advancedMounts:
          pluto-proxy:
            app:
              - path: /breaks
                subPath: media/live-tv-breaks
                readOnly: true
      script:
        type: configMap
        name: pluto-proxy-script
        advancedMounts:
          pluto-proxy:
            app:
              - path: /app
                readOnly: true
