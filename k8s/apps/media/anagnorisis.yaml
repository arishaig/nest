apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anagnorisis
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Pinned to omega (talos-omega, the gaming PC's RTX 3080), same pattern as
    # subgen/tdarr-node (k8s/apps/media/subgen.yaml): GPU-accelerated
    # embeddings need nvidia.com/gpu, and omega is the only node that
    # advertises it. Reschedule-tolerant by design, not an oversight — when
    # the owner reboots into Windows, anagnorisis just sits pending until
    # omega rejoins (see KubeNodeNotReady exclusion for omega in
    # playbooks/provision/files/monitoring/prometheus/rules/nest.yml). See
    # docs/gaming-gpu-talos.md.
    defaultPodOptions:
      # CDI isn't the cluster default (gpu-operator ClusterPolicy has
      # cdi.default: false) — without this the pod schedules fine
      # (nvidia.com/gpu is just a resource count) but gets no actual GPU
      # device, a runtime failure invisible to kustomize/CI.
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [omega]
    controllers:
      anagnorisis:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/arishaig/anagnorisis
              # Immutable sha tag from the docker-build workflow. Bump this to roll
              # out a new build — Flux reconciles the change from git (no kubectl).
              # CUDA-enabled build (cu121 wheels, anagnorisis/Dockerfile),
              # omni_service removed (superseded by this node's direct GPU
              # access), and merged through upstream volotat/Anagnorisis
              # v0.4.9 (new unified multimodal embedder + omni descriptor —
              # see k8s/apps/media/anagnorisis-config-map.yaml).
              tag: sha-f897142
              pullPolicy: IfNotPresent
            # Use sh wrapper so we can merge stderr→stdout (tracebacks land in
            # Loki); exec replaces sh with Python for clean PID 1 / signals.
            command: ["/bin/sh", "-c"]
            args:
              - "exec python -u app.py 2>&1"
            env:
              FLASK_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: anagnorisis-secret
                    key: FLASK_SECRET_KEY
              RUNNING_IN_DOCKER: "true"
              CONTAINER_NAME: anagnorisis
              # Needed to download the gated google/gemma-4-E2B-it omni
              # descriptor model (see config.yaml's omni.model_name) — the
              # unauthenticated fallback works for the public jina embedder
              # but 401s on gated repos. Same hugging_face_access_token vault
              # var subgen already uses (playbooks/provision/k8s.yml).
              HF_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: anagnorisis-hf-secret
                    key: HF_TOKEN
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5001
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 30
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5001
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: false
            # nvidia.com/gpu in both requests and limits: the device plugin
            # requires them to match (integer, non-overcommittable resource)
            # — this is also what actually gets anagnorisis scheduled onto
            # omega and grants it access to the GPU device.
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "2"
                memory: 6Gi
                nvidia.com/gpu: "1"
    service:
      app:
        controller: anagnorisis
        ports:
          http:
            port: 5001
            targetPort: 5001
    persistence:
      config-yaml:
        type: configMap
        name: anagnorisis-config
        advancedMounts:
          anagnorisis:
            app:
              - path: /app/config.yaml
                subPath: config.yaml
                readOnly: true
      data:
        existingClaim: anagnorisis-config
        advancedMounts:
          anagnorisis:
            app:
              - path: /project_config
              - path: /app/models
                subPath: models
      media:
        existingClaim: media-nfs
        advancedMounts:
          anagnorisis:
            app:
              - path: /mnt
                readOnly: true
