apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Pinned to alpha (nest.arishaig.site/workloads=general). The soft
    # preference let it land on gamma-rpi5, where the 1Gi limit OOMKilled it
    # 17x in 6 days (2026-10-09) and the Pi had no headroom to raise it.
    # Jellyfin (amd64, not omega) can only run on alpha anyway, so pinning its
    # DB there adds no new failure domain. Also keeps it off omega (the
    # dual-boot gaming PC), which took Jellyfin/Mealie down in 2026-09.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general]
    controllers:
      postgres:
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=postgres
              repository: postgres
              tag: "18.6"
            # JIT off: Jellyfin's EF-generated queries are huge (dozens of
            # subqueries) and cross jit_above_cost, so each backend compiles
            # them with LLVM, which is pure overhead for OLTP and allocates
            # outside Postgres's memory contexts.
            # max_connections/shared_buffers: headroom for the *arrs moving
            # here from SQLite (docs/media-postgres-migration.md); each holds
            # pools for a main and a log DB.
            args:
              - "-c"
              - "jit=off"
              - "-c"
              - "max_connections=200"
              - "-c"
              - "shared_buffers=512MB"
            env:
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_USER
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_PASSWORD
              PGUSER:
                valueFrom:
                  secretKeyRef:
                    name: postgres-secret
                    key: POSTGRES_USER
              # PVC mounts at /var/lib/postgresql; the live DB lives in the
              # /data subdir of the PVC — must match exactly to find existing data.
              PGDATA: /var/lib/postgresql/data
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready"]
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["pg_isready"]
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              # Jellyfin backends peak at ~250MB anon each on its big
              # library queries (kernel OOM report, 2026-10-09); 1Gi was
              # exhausted with a handful running concurrently. 4Gi adds room
              # for shared_buffers=512MB and the *arr connections.
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    service:
      app:
        controller: postgres
        ports:
          postgres:
            port: 5432
            targetPort: 5432
    persistence:
      data:
        existingClaim: postgres-data
        advancedMounts:
          postgres:
            app:
              - path: /var/lib/postgresql
