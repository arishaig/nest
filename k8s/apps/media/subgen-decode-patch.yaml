apiVersion: v1
kind: ConfigMap
metadata:
  name: subgen-decode-patch
  namespace: media
data:
  # Mounted at /patches with PYTHONPATH=/patches on the subgen container, so
  # Python imports this as sitecustomize at interpreter start. Works around
  # faster-whisper's decode_audio failing on DTS-HD MA tracks ("Frame does not
  # match AudioFifo parameters") — see the docstring below. Not tied to the
  # image tag: it patches faster_whisper.audio at import time, so a subgen
  # image bump needs no change here.
  sitecustomize.py: |
    """Replace faster-whisper's PyAV-based decode_audio with an ffmpeg CLI one.

    faster_whisper.audio.decode_audio feeds raw decoded frames into a PyAV
    AudioFifo, which is locked to the first frame's format. DTS-HD MA tracks
    change sample format/layout mid-stream (s32p 5.1 -> s16p 7.1), so the FIFO
    raises "Frame does not match AudioFifo parameters" and the whole file fails.
    The ffmpeg CLI resamples every frame to 16 kHz mono itself and does not care.

    Loaded automatically because this directory is on PYTHONPATH. An import hook
    patches faster_whisper.audio as it is imported, so every
    `from faster_whisper.audio import decode_audio` binds to the replacement.
    """
    import importlib.abc
    import importlib.machinery
    import logging
    import os
    import subprocess
    import sys

    _TARGET = "faster_whisper.audio"


    def _make_decode_audio(original):
        def decode_audio(input_file, sampling_rate=16000, split_stereo=False):
            if split_stereo:
                return original(input_file, sampling_rate, split_stereo)

            import numpy as np

            stdin_data = None
            if isinstance(input_file, (str, os.PathLike)):
                source, label = os.fspath(input_file), os.fspath(input_file)
            else:
                stdin_data = input_file if isinstance(input_file, bytes) else input_file.read()
                source, label = "pipe:0", "<stream>"

            cmd = [
                "ffmpeg", "-v", "error", "-i", source,
                "-map", "0:a:0", "-vn", "-sn", "-dn",
                "-ac", "1", "-ar", str(sampling_rate),
                "-f", "s16le", "pipe:1",
            ]
            if stdin_data is None:
                cmd.insert(1, "-nostdin")

            proc = subprocess.run(cmd, input=stdin_data, capture_output=True, check=False)
            err = proc.stderr.decode(errors="replace").strip()[-500:]
            if not proc.stdout:
                raise ValueError(f"ffmpeg decoded no audio from {label}: {err}")
            if proc.returncode != 0:
                logging.warning("ffmpeg exited %s decoding %s (using partial audio): %s",
                                proc.returncode, label, err)

            return np.frombuffer(proc.stdout, np.int16).astype(np.float32) / 32768.0

        return decode_audio


    class _Loader(importlib.abc.Loader):
        def __init__(self, wrapped):
            self._wrapped = wrapped

        def create_module(self, spec):
            return self._wrapped.create_module(spec)

        def exec_module(self, module):
            self._wrapped.exec_module(module)
            module.decode_audio = _make_decode_audio(module.decode_audio)

        def __getattr__(self, name):
            return getattr(self._wrapped, name)


    class _Finder(importlib.abc.MetaPathFinder):
        def find_spec(self, fullname, path, target=None):
            if fullname != _TARGET:
                return None
            spec = importlib.machinery.PathFinder.find_spec(fullname, path)
            if spec is not None and spec.loader is not None:
                spec.loader = _Loader(spec.loader)
            return spec


    sys.meta_path.insert(0, _Finder())
