apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr-node
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Allowed on alpha (general) or omega (GPU node) — the 4Gi memory limit
    # (transcode workers) exceeds rpi5 capacity, so it must never schedule
    # there. Prefer omega for NVENC/NVDEC hardware transcode; the
    # nvidia.com/gpu limit below already pins the pod there in practice since
    # omega is the only node advertising that resource.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [omega]
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general, omega]
    controllers:
      tdarr-node:
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/haveagitgat/tdarr_node
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 2.77.01
            env:
              TZ: America/Los_Angeles
              PUID: "1000"
              PGID: "1000"
              serverIP: tdarr
              serverPort: "8266"
              inContainer: "true"
              # Required for NVENC/NVDEC in this container even with the GPU
              # operator's device plugin handling the nvidia.com/gpu limit —
              # the base image doesn't set these itself. "video" specifically
              # (not just compute,utility) is what exposes hardware
              # encode/decode to ffmpeg; omitting it silently falls back to
              # CPU transcode with no error.
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 4Gi
                nvidia.com/gpu: 1
    # no service — the node dials out to the tdarr server service (serverIP: tdarr)
    persistence:
      data:
        existingClaim: tdarr-data
        advancedMounts:
          tdarr-node:
            app:
              - path: /app/configs
                subPath: configs
              - path: /app/logs
                subPath: logs
      media:
        existingClaim: media-nfs
        advancedMounts:
          tdarr-node:
            app:
              - path: /media
                readOnly: true
      transcode-cache:
        type: emptyDir
        advancedMounts:
          tdarr-node:
            app:
              - path: /temp
