apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tunarr
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # chrisbenincasa/tunarr has no arm64 build — pin off beta-rpi5 so it
    # doesn't crash-loop there ("exec format error") now that the Pi is
    # schedulable. See k8s/apps/media/homepage.yaml for the beta-rpi5 story.
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      tunarr:
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=chrisbenincasa/tunarr
              repository: chrisbenincasa/tunarr
              tag: 1.3.15
            env:
              TZ: America/Los_Angeles
              TUNARR_DATABASE_PATH: /config/tunarr
              # GPU offload to omega (docs/tunarr-offload.md). The wrapper only
              # takes effect once ffmpegExecutablePath is /offload/ffmpeg (a
              # setting in /config/tunarr/settings.json, not in git).
              # Kill switch: OFFLOAD_DISABLED=1 runs everything locally, or set
              # ffmpegExecutablePath back to /usr/bin/ffmpeg.
              FFMPEG_REAL: /usr/local/bin/ffmpeg
              FFMPEG_RUNNER_HOST: jellyfin-ffmpeg-runner
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                # Was 1Gi; OOMKilled 7x in 24h (2026-09-10), which also
                # explains the ExternalEndpointDown probe failures (event
                # loop stalls near the limit — one Jellyfin /Items call took
                # 9.8min). No cAdvisor/kubelet scrape exists for k8s pods, so
                # this is a blind bump, not sized against usage history.
                memory: 2Gi
    service:
      app:
        controller: tunarr
        type: ClusterIP
        ports:
          http:
            port: 8000
            targetPort: 8000
    persistence:
      config:
        existingClaim: tunarr-config
        advancedMounts:
          tunarr:
            app:
              - path: /config/tunarr
      offload-scripts:
        type: configMap
        name: tunarr-offload-scripts
        defaultMode: 493  # 0755 (decimal: yamllint forbids implicit octal)
        advancedMounts:
          tunarr:
            app:
              - path: /offload
      offload-secret:
        type: secret
        name: jellyfin-ffmpeg-runner
        advancedMounts:
          tunarr:
            app:
              - path: /offload-secret
                readOnly: true
      # HLS output shared with the runner on omega at the same absolute path
      # (jellyfin-scratch: lookupcache=positive, actimeo=2; regenerable).
      streams:
        existingClaim: jellyfin-scratch
        advancedMounts:
          tunarr:
            app:
              - path: /config/tunarr/streams
                subPath: tunarr-streams
