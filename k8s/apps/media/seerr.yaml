apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 1h
  # Explicit so kustomize-controller owns this field: a stray
  # `flux suspend` is reverted on the next apps reconcile instead of
  # silently freezing the release (25 media HRs sat suspended
  # 2026-08-02..09-24). For break-glass, suspend the `apps` Kustomization.
  suspend: false
  chart:
    spec:
      chart: app-template
      version: 4.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    # Prefer alpha (nest.arishaig.site/workloads=general): alpha has the most
    # headroom of the workers. Soft so it can still reschedule elsewhere if
    # alpha is unavailable.
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nest.arishaig.site/workloads
                    operator: In
                    values: [general]
    controllers:
      seerr:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              # renovate: datasource=docker depName=ghcr.io/seerr-team/seerr
              repository: ghcr.io/seerr-team/seerr
              tag: v3.3.0
            env:
              TZ: America/Los_Angeles
              # On the shared media Postgres since 2026-10-11
              # (docs/media-postgres-migration.md). Rollback: revert this
              # block and Seerr reopens its untouched SQLite in /app/config/db.
              DB_TYPE: postgres
              DB_HOST: postgres
              DB_PORT: "5432"
              DB_NAME: seerr
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: seerr-postgres-secret
                    key: POSTGRES_USER
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: seerr-postgres-secret
                    key: POSTGRES_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: 5055
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/settings/public
                    port: 5055
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: false
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: seerr
        type: ClusterIP
        ports:
          http:
            port: 5055
            targetPort: 5055
    persistence:
      config:
        existingClaim: seerr-config
        advancedMounts:
          seerr:
            app:
              - path: /app/config
