# SOPS encryption rules (docs/secrets.md). One age recipient; the private key
# lives in ~/.config/sops/age/keys.txt, the SOPS_AGE_KEY GitHub secret, the
# flux-system/sops-age Secret, and offline custody copies.
creation_rules:
  # k8s Secrets reconciled by Flux: encrypt only the payload, so kind/metadata
  # stay readable for kustomize and review.
  - path_regex: ^k8s/.*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age17pgmpmdrwrdxtw3rxlyumtcl78nwv4d3errll2u687uvhkxmzg4qefuw95
  # Ansible vars (community.sops vars plugin): every value.
  - path_regex: ^inventory/.*\.sops\.ya?ml$
    age: age17pgmpmdrwrdxtw3rxlyumtcl78nwv4d3errll2u687uvhkxmzg4qefuw95
  # OpenTofu variables, decrypted to a tfvars.json in CI.
  - path_regex: ^terraform/.*\.sops\.json$
    age: age17pgmpmdrwrdxtw3rxlyumtcl78nwv4d3errll2u687uvhkxmzg4qefuw95
