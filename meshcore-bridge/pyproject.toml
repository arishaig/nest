[project]
name = "meshcore-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt==2.1.0",
    "cryptography==50.0.2",
    "pydantic-settings==2.16.2",
]

[project.scripts]
meshcore-bridge = "meshcore_bridge.main:serve"

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshcore_bridge"]
