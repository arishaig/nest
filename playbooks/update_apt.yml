---
- name: Apply apt updates
  # Named groups, not `all:!...`: `all` also matched talos (no SSH, so it
  # failed and, with serial: 1, ended the play) and ran the VPS twice, since
  # dns-tertiary and vps-proxy are the same machine.
  hosts: lxcs:dns:vps:!dns-tertiary
  become: true
  serial: 1
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Upgrade packages (safe — won't remove packages)
      apt:
        upgrade: safe
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: upgrade_result

    - name: Show what was upgraded
      debug:
        msg: "{{ upgrade_result.stdout_lines }}"
      when: upgrade_result.changed

    - name: Remove unused packages
      apt:
        autoremove: yes
        purge: yes

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Notify if reboot needed
      debug:
        msg: "REBOOT REQUIRED on {{ inventory_hostname }}"
      when: reboot_required.stat.exists