---
# Provision the Vultr VPS proxy (Debian 13 trixie)
# Runs Traefik (native binary) + WireGuard tunnel to Nest docker LXC
# WireGuard: private keys in group_vars/all.sops.yaml, public keys in group_vars/all/vars.yml

- name: VPS proxy provisioning
  hosts: vps-proxy
  become: true
  gather_facts: true

  vars:
    traefik_version: "3.7.16"
    traefik_arch: "amd64"
    node_exporter_version: "1.12.1"
    alloy_version: "1.21.0"

  tasks:
    # --- Bootstrap ---
    - name: Update apt cache and upgrade
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - wireguard-tools
          - curl
          - ca-certificates
          - nftables
          - logrotate
          - unattended-upgrades
          - fail2ban
          - bind9-dnsutils
        state: present

    - name: Set authorized SSH keys
      ansible.posix.authorized_key:
        user: root
        key: "{{ item }}"
        state: present
      loop:
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBM7Y+b/BRai//GJ7Sczob/rX8ck3ArKGQP/jsR5OlWn isaac@isaaclaptop"
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMxOgEao2c+jTY4NdsEp46M9Fs8i1Yx6WiX42rUAXSJh ansible-on-nest"

    # --- SSH hardening ---
    - name: Disable password authentication and enforce key-only root login
      ansible.builtin.copy:
        content: |
          PasswordAuthentication no
          PermitRootLogin prohibit-password
        dest: /etc/ssh/sshd_config.d/99-hardened.conf
        mode: "0600"
      notify: Restart sshd

    # --- fail2ban ---
    - name: Deploy fail2ban jail config
      ansible.builtin.copy:
        content: |
          [sshd]
          enabled  = true
          maxretry = 5
          bantime  = 1h
          findtime = 10m
        dest: /etc/fail2ban/jail.d/sshd.conf
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    # --- ufw ---
    # ufw ships enabled on Vultr's Debian image and silently coexists with
    # nftables (separate iptables-nft tables), default-denying everything but
    # 22/tcp. It blocked the WireGuard tunnel for 8+ hours on 2026-07-27 even
    # after nftables/wg-quick were fixed. nftables below is the sole intended
    # firewall for this host. Removed outright (not just disabled) so a
    # future package upgrade can't silently re-enable it.
    - name: Check whether ufw is installed
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: ufw_binary

    - name: Disable ufw before removal
      community.general.ufw:
        state: disabled
      when: ufw_binary.stat.exists

    - name: Remove ufw package
      ansible.builtin.apt:
        name: ufw
        state: absent
        purge: true

    # --- nftables firewall ---
    - name: Deploy nftables ruleset
      ansible.builtin.copy:
        # Declare-then-delete replaces only this table on each load; without
        # it every reload appended a second copy of the rules. Not `flush
        # ruleset`: fail2ban and Docker keep their own tables on this host.
        content: |
          table inet filter
          delete table inet filter

          table inet filter {
            # Home WAN IP, refreshed from vpn.arishaig.site by home-wan-nft.timer
            set home_wan {
              type ipv4_addr
            }

            chain input {
              type filter hook input priority 0; policy drop;
              iif lo accept
              ct state established,related accept
              tcp dport 22 accept
              tcp dport { 80, 443 } accept
              udp dport 51820 accept
              tcp dport 853 accept
              udp dport 853 accept
              # Plain DNS (tertiary resolver) — home and WireGuard only, never
              # public: an open resolver gets abused for amplification DDoS.
              ip saddr @home_wan meta l4proto { tcp, udp } th dport 53 accept
              iifname "wg0" meta l4proto { tcp, udp } th dport 53 accept
              icmp type echo-request accept
              # node_exporter, Traefik metrics, AdGuard + Unbound exporters — WireGuard peers only
              iifname "wg0" tcp dport { 8080, 9100, 9167, 9618 } accept
            }
            chain forward {
              type filter hook forward priority 0; policy drop;
            }
            chain output {
              type filter hook output priority 0; policy accept;
            }
          }
        dest: /etc/nftables.conf
        mode: "0600"
      notify:
        - Reload nftables
        - Refresh home WAN set

    - name: Enable and start nftables
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

    # The home WAN IP is dynamic (cloudflare-ddns keeps vpn.arishaig.site
    # current), so resolve it on a timer and swap it into the home_wan set.
    # Queries 1.1.1.1 rather than the local AdGuard so a broken local resolver
    # can't lock home out of the resolver it's meant to back up.
    - name: Deploy home WAN set updater
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          set -eu
          ip=$(dig +short +time=3 +tries=2 A vpn.arishaig.site @1.1.1.1 | grep -E '^[0-9]+(\.[0-9]+){3}$' | tail -n1)
          if [ -z "$ip" ]; then
            echo "vpn.arishaig.site did not resolve; keeping current home_wan set" >&2
            exit 1
          fi
          printf 'flush set inet filter home_wan\nadd element inet filter home_wan { %s }\n' "$ip" | nft -f -
        dest: /usr/local/bin/home-wan-nft.sh
        mode: "0755"

    - name: Deploy home WAN set updater service and timer
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "/etc/systemd/system/{{ item.name }}"
        mode: "0644"
      loop:
        - name: home-wan-nft.service
          content: |
            [Unit]
            Description=Refresh nftables home_wan set from vpn.arishaig.site
            After=nftables.service network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/home-wan-nft.sh
        - name: home-wan-nft.timer
          content: |
            [Unit]
            Description=Refresh nftables home_wan set every 5 minutes

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=5min

            [Install]
            WantedBy=timers.target
      notify:
        - Reload systemd
        - Refresh home WAN set

    # Every nftables (re)load recreates home_wan empty — including the
    # `systemctl reload nftables` in wg0's PostUp — so refill it right away
    # instead of leaving home locked out until the next timer tick.
    - name: Create nftables override directory
      ansible.builtin.file:
        path: /etc/systemd/system/nftables.service.d
        state: directory
        mode: "0755"

    - name: Refill home WAN set whenever nftables loads
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStartPost=-/usr/local/bin/home-wan-nft.sh
          ExecReload=-/usr/local/bin/home-wan-nft.sh
        dest: /etc/systemd/system/nftables.service.d/home-wan.conf
        mode: "0644"
      notify: Reload systemd

    - name: Enable and start home WAN set timer
      ansible.builtin.systemd:
        name: home-wan-nft.timer
        enabled: true
        state: started
        daemon_reload: true

    # --- WireGuard ---
    - name: Deploy WireGuard config
      ansible.builtin.template:
        src: templates/wireguard/wg0-vps.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: Restart WireGuard

    - name: Create wg-quick@wg0 override directory
      ansible.builtin.file:
        path: /etc/systemd/system/wg-quick@wg0.service.d
        state: directory
        mode: "0755"

    - name: Deploy wg-quick@wg0 restart-on-failure override
      ansible.builtin.copy:
        content: |
          [Unit]
          StartLimitIntervalSec=0

          [Service]
          Restart=on-failure
          RestartSec=5s
        dest: /etc/systemd/system/wg-quick@wg0.service.d/override.conf
        mode: "0644"
      notify:
        - Reload systemd
        - Restart WireGuard

    - name: Enable and start WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
        daemon_reload: true

    # --- Traefik binary ---
    - name: Download Traefik binary
      ansible.builtin.get_url:
        url: "https://github.com/traefik/traefik/releases/download/v{{ traefik_version }}/traefik_v{{ traefik_version }}_linux_{{ traefik_arch }}.tar.gz"
        dest: /tmp/traefik.tar.gz
        mode: "0644"

    - name: Extract Traefik binary
      ansible.builtin.unarchive:
        src: /tmp/traefik.tar.gz
        dest: /usr/local/bin
        include: traefik
        remote_src: true
        mode: "0755"

    - name: Create Traefik config directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/traefik
        - /etc/traefik/dynamic
        - /var/log/traefik

    - name: Deploy Traefik static config
      ansible.builtin.copy:
        src: files/vps/traefik/traefik.yml
        dest: /etc/traefik/traefik.yml
        mode: "0644"
      notify: Restart Traefik

    - name: Deploy Traefik dynamic configs
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/traefik/dynamic/
        mode: "0644"
      with_fileglob:
        - files/vps/traefik/dynamic/*.yml
      notify: Restart Traefik

    - name: Deploy Traefik systemd unit
      ansible.builtin.copy:
        src: files/vps/traefik.service
        dest: /etc/systemd/system/traefik.service
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Traefik

    - name: Enable and start Traefik
      ansible.builtin.systemd:
        name: traefik
        enabled: true
        state: started
        daemon_reload: true

    # --- node_exporter ---
    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: "0755"
        remote_src: true

    - name: Create node_exporter systemd service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target wg-quick@wg0.service
          Wants=wg-quick@wg0.service
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          ExecStart=/usr/local/bin/node_exporter --collector.systemd --collector.processes --web.listen-address=10.10.0.1:9100
          Restart=always
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/node_exporter.service
        mode: "0644"
      notify: Restart node_exporter

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        enabled: true
        state: started
        daemon_reload: true

    - name: Clean up node_exporter download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node_exporter.tar.gz
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

    # --- Alloy (log shipper, replaces Promtail) ---
    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/alloy
        - /var/lib/alloy

    - name: Download Alloy binary
      ansible.builtin.get_url:
        url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-linux-amd64.zip"
        dest: /var/tmp/alloy.zip
        mode: "0644"

    - name: Install unzip
      ansible.builtin.apt:
        name: unzip
        state: present

    - name: Extract Alloy binary
      ansible.builtin.unarchive:
        src: /var/tmp/alloy.zip
        dest: /var/tmp
        remote_src: true

    - name: Install Alloy binary
      ansible.builtin.copy:
        src: /var/tmp/alloy-linux-amd64
        dest: /usr/local/bin/alloy
        mode: "0755"
        remote_src: true

    - name: Deploy Alloy config
      ansible.builtin.copy:
        src: files/vps/alloy/config.alloy
        dest: /etc/alloy/config.alloy
        mode: "0644"
      notify: Restart Alloy
      tags: [alloy]

    - name: Deploy Alloy systemd unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Grafana Alloy
          After=network.target wg-quick@wg0.service

          [Service]
          ExecStart=/usr/local/bin/alloy run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/alloy.service
        mode: "0644"
      notify:
        - Reload systemd
        - Restart Alloy
      tags: [alloy]

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started
        daemon_reload: true
      tags: [alloy]

    - name: Clean up Alloy download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/tmp/alloy.zip
        - /var/tmp/alloy-linux-amd64

    # --- BBR congestion control ---
    - name: Enable BBR congestion control and tune socket buffers
      ansible.builtin.copy:
        content: |
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          net.core.rmem_max = 16777216
          net.core.wmem_max = 16777216
          net.core.rmem_default = 262144
          net.core.wmem_default = 262144
        dest: /etc/sysctl.d/99-bbr.conf
        mode: "0644"
      notify: Apply sysctl

    # --- logrotate ---
    - name: Configure Traefik log rotation
      ansible.builtin.copy:
        content: |
          /var/log/traefik/*.log {
            daily
            rotate 7
            compress
            delaycompress
            missingok
            notifempty
            sharedscripts
            postrotate
              kill -USR1 $(systemctl show -p MainPID traefik | cut -d= -f2) 2>/dev/null || true
            endscript
          }
        dest: /etc/logrotate.d/traefik
        mode: "0644"

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    # Reload, not restart: the unit's ExecStop is `nft flush ruleset`, which
    # would take fail2ban's and Docker's tables down with ours.
    - name: Reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: reloaded
        daemon_reload: true

    # Must follow Reload nftables: the reload recreates home_wan empty.
    - name: Refresh home WAN set
      ansible.builtin.systemd:
        name: home-wan-nft.service
        state: started
        daemon_reload: true

    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Traefik
      ansible.builtin.systemd:
        name: traefik
        state: restarted

    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true

    - name: Restart Alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
        daemon_reload: true

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
