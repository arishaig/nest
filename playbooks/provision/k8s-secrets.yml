---
# Source of truth for k8s Secrets that Flux reconciles (docs/secrets.md,
# phase 2). Values come from group_vars/all.sops.yaml, the same vars the LXC
# templates, MCP and tofu read, so there is one canonical copy.
#
# Don't apply this. scripts/render-k8s-secrets.sh runs it to render the list
# to a private temp file, then writes each entry, SOPS-encrypted, to
# k8s/<dir>/<name>.sops.yaml, which Flux decrypts and applies. Run that script
# after changing an entry or a value it uses; CI fails if the files are stale.
#
# Each entry: name, namespace, data (stringData), and kind (default Secret).

- name: Render k8s Secrets for SOPS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    k8s_secrets:
      - name: postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ mealie_postgres_user }}"
          POSTGRES_PASSWORD: "{{ mealie_postgres_password }}"
      # Jellyfin's own non-superuser role on the shared postgres, owning
      # only the `jellyfin` DB (postgres-secret is Mealie's superuser).
      - name: jellyfin-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ jellyfin_postgres_user }}"
          POSTGRES_PASSWORD: "{{ jellyfin_postgres_password }}"
      # Per-app non-superuser roles on the shared postgres for the apps
      # moving off SQLite (docs/media-postgres-migration.md). Each owns only
      # <app>-main and <app>-log (Seerr and Bazarr: one DB). Generated by
      # scripts/gen-pg-app-secrets.sh.
      - name: prowlarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ prowlarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ prowlarr_postgres_password }}"
      - name: radarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ radarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ radarr_postgres_password }}"
      - name: sonarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ sonarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ sonarr_postgres_password }}"
      - name: bazarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ bazarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ bazarr_postgres_password }}"
      - name: seerr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ seerr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ seerr_postgres_password }}"
      - name: lidarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ lidarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ lidarr_postgres_password }}"
      - name: lidarr-api-key
        namespace: media
        data:
          APIKEY: "{{ lidarr_api_key }}"
      - name: bazarr-api-key
        namespace: media
        data:
          APIKEY: "{{ bazarr_api_key }}"
      # Digarr (docs/music-digarr.md): encrypts stored connector tokens at
      # rest. Deliberately no Lidarr key — discovery-only trial.
      - name: digarr-secret
        namespace: media
        data:
          DIGARR_ENCRYPTION_KEY: "{{ digarr_encryption_key }}"
      - name: prowlarr-api-key
        namespace: media
        data:
          APIKEY: "{{ prowlarr_api_key }}"
      # AudioMuse-AI (docs/music-audiomuse.md). JELLYFIN_TOKEN is a
      # dedicated Jellyfin API key, not jellyfin_api_key (nest-mcp's), so
      # it can be revoked on its own.
      - name: audiomuse-secret
        namespace: media
        data:
          POSTGRES_PASSWORD: "{{ audiomuse_postgres_password }}"
          JELLYFIN_USER_ID: "{{ audiomuse_jellyfin_user_id }}"
          JELLYFIN_TOKEN: "{{ audiomuse_jellyfin_token }}"
      - name: subgen-secrets
        namespace: media
        data:
          HF_TOKEN: "{{ hugging_face_access_token }}"
      - name: sonarr-api-key
        namespace: media
        data:
          APIKEY: "{{ sonarr_api_key }}"
      - name: radarr-api-key
        namespace: media
        data:
          APIKEY: "{{ radarr_api_key }}"
  tasks:
    - name: Write rendered Secrets (plaintext) to the caller's private temp file
      ansible.builtin.copy:
        content: "{{ k8s_secrets | to_json }}"
        dest: "{{ render_out }}"
        mode: "0600"
      no_log: true
