---
# Source of truth for k8s Secrets that Flux reconciles (docs/secrets.md,
# phase 2). Values come from group_vars/all.sops.yaml, the same vars the LXC
# templates, MCP and tofu read, so there is one canonical copy.
#
# Don't apply this. scripts/render-k8s-secrets.sh runs it to render the list
# to a private temp file, then writes each entry, SOPS-encrypted, to
# k8s/<dir>/<name>.sops.yaml, which Flux decrypts and applies. Run that script
# after changing an entry or a value it uses; CI fails if the files are stale.
#
# Each entry: name, namespace, data (stringData), and kind (default Secret).

- name: Render k8s Secrets for SOPS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    k8s_secrets:
      - name: postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ mealie_postgres_user }}"
          POSTGRES_PASSWORD: "{{ mealie_postgres_password }}"
      # Jellyfin's own non-superuser role on the shared postgres, owning
      # only the `jellyfin` DB (postgres-secret is Mealie's superuser).
      - name: jellyfin-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ jellyfin_postgres_user }}"
          POSTGRES_PASSWORD: "{{ jellyfin_postgres_password }}"
      # Per-app non-superuser roles on the shared postgres for the apps
      # moving off SQLite (docs/media-postgres-migration.md). Each owns only
      # <app>-main and <app>-log (Seerr and Bazarr: one DB). Generated by
      # scripts/gen-pg-app-secrets.sh.
      - name: prowlarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ prowlarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ prowlarr_postgres_password }}"
      - name: radarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ radarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ radarr_postgres_password }}"
      - name: sonarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ sonarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ sonarr_postgres_password }}"
      - name: bazarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ bazarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ bazarr_postgres_password }}"
      - name: seerr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ seerr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ seerr_postgres_password }}"
      - name: lidarr-postgres-secret
        namespace: media
        data:
          POSTGRES_USER: "{{ lidarr_postgres_user }}"
          POSTGRES_PASSWORD: "{{ lidarr_postgres_password }}"
      - name: lidarr-api-key
        namespace: media
        data:
          APIKEY: "{{ lidarr_api_key }}"
      - name: bazarr-api-key
        namespace: media
        data:
          APIKEY: "{{ bazarr_api_key }}"
      # Digarr (docs/music-digarr.md): encrypts stored connector tokens at
      # rest. Deliberately no Lidarr key — discovery-only trial.
      - name: digarr-secret
        namespace: media
        data:
          DIGARR_ENCRYPTION_KEY: "{{ digarr_encryption_key }}"
      - name: prowlarr-api-key
        namespace: media
        data:
          APIKEY: "{{ prowlarr_api_key }}"
      # AudioMuse-AI (docs/music-audiomuse.md). JELLYFIN_TOKEN is a
      # dedicated Jellyfin API key, not jellyfin_api_key (nest-mcp's), so
      # it can be revoked on its own.
      - name: audiomuse-secret
        namespace: media
        data:
          POSTGRES_PASSWORD: "{{ audiomuse_postgres_password }}"
          JELLYFIN_USER_ID: "{{ audiomuse_jellyfin_user_id }}"
          JELLYFIN_TOKEN: "{{ audiomuse_jellyfin_token }}"
      - name: subgen-secrets
        namespace: media
        data:
          HF_TOKEN: "{{ hugging_face_access_token }}"
      # Shared secret between the Jellyfin ffmpeg wrapper and the omega runner
      # (k8s/apps/media/jellyfin-offload/); Flannel enforces no NetworkPolicy,
      # so the token is what stops other pods running ffmpeg on the GPU.
      - name: jellyfin-ffmpeg-runner
        namespace: media
        data:
          token: "{{ jellyfin_ffmpeg_runner_token }}"
      - name: sonarr-api-key
        namespace: media
        data:
          APIKEY: "{{ sonarr_api_key }}"
      - name: radarr-api-key
        namespace: media
        data:
          APIKEY: "{{ radarr_api_key }}"

      # cert-manager DNS-01 solver token (Cloudflare).
      - name: cloudflare-api-token
        namespace: cert-manager
        data:
          api-token: "{{ traefik_cf_dns_api_token }}"

      - name: authelia-env-secret
        namespace: authelia
        data:
          AUTHELIA_SESSION_SECRET: "{{ authelia_session_secret }}"
          AUTHELIA_STORAGE_ENCRYPTION_KEY: "{{ authelia_storage_encryption_key }}"
          AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "{{ authelia_jwt_secret }}"

      # Rendered from templates/k8s/authelia-configuration.yml.j2.
      - name: authelia-config
        namespace: authelia
        data:
          configuration.yml: "{{ lookup('template', 'templates/k8s/authelia-configuration.yml.j2') }}"

      # Users DB (password hashes), rendered from templates/docker/authelia-users.yml.j2.
      - name: authelia-users
        namespace: authelia
        kind: ConfigMap
        data:
          users_database.yml: "{{ lookup('template', 'templates/docker/authelia-users.yml.j2') }}"

      # MQTT login for meshcore-bridge (k8s/apps/meshcore): a Mosquitto add-on
      # login on HA's broker, used only to subscribe to meshcore/# and
      # republish decoded hits.
      - name: meshcore-bridge-secrets
        namespace: meshcore
        data:
          MESHCORE_BRIDGE_MQTT_USER: "{{ meshcore_mqtt_user }}"
          MESHCORE_BRIDGE_MQTT_PASS: "{{ meshcore_mqtt_password }}"

      - name: nest-mcp-secrets
        namespace: nest-mcp
        data:
          NEST_PROXMOX_TOKEN: "{{ nest_mcp_pve_token }}"
          NEST_VPS_VULTR_API_KEY: "{{ vultr_api_key }}"
          NEST_PBS_PASSWORD: "{{ pbs_password }}"
          NEST_UNIFI_USERNAME: "{{ unpoller_unifi_user }}"
          NEST_UNIFI_PASSWORD: "{{ unpoller_unifi_pass }}"
          NEST_ADGUARD_PASSWORD: "{{ adguard_admin_password }}"
          NEST_HA_TOKEN: "{{ homeassistant_bearer_token }}"
          NEST_GRAFANA_PASSWORD: "{{ grafana_admin_password }}"
          NEST_SONARR_KEY: "{{ sonarr_api_key }}"
          NEST_RADARR_KEY: "{{ radarr_api_key }}"
          NEST_LIDARR_KEY: "{{ lidarr_api_key }}"
          NEST_PROWLARR_KEY: "{{ prowlarr_api_key }}"
          NEST_JELLYSEERR_KEY: "{{ jellyseerr_api_key }}"
          NEST_JELLYFIN_KEY: "{{ jellyfin_api_key }}"
          NEST_MEALIE_KEY: "{{ nest_mcp_mealie_token }}"
          NEST_K8S_TOKEN: "{{ k8s_mcp_sa_token }}"
          MCP_PORT: "8765"
          MCP_AUTHELIA_ISSUER: "https://auth.arishaig.site"
          MCP_CLIENT_ID: "nest-mcp"
          MCP_CLIENT_SECRET: "{{ authelia_oidc_client_secret_nest_mcp }}"

      # SSH key nest-mcp uses to reach the lab hosts.
      - name: nest-mcp-ssh-key
        namespace: nest-mcp
        data:
          ansible-on-nest: "{{ nest_mcp_ssh_private_key }}"

      # God's Eye View provider keys (k8s/apps/gods-eye-view). Blank values
      # leave that provider keyless/off. The three browser keys
      # (GOOGLE_MAPS_API_KEY, CESIUM_ION_TOKEN, MAPILLARY_CLIENT_TOKEN) are
      # served to every visitor: restrict them provider-side.
      - name: gods-eye-view-secrets
        namespace: gods-eye-view
        data:
          OPENAI_API_KEY: "{{ gev_openai_api_key }}"
          GOOGLE_MAPS_API_KEY: "{{ gev_google_maps_api_key }}"
          GOOGLE_MAPS_SERVER_API_KEY: "{{ gev_google_maps_server_api_key }}"
          CESIUM_ION_TOKEN: "{{ gev_cesium_ion_token }}"
          MAPILLARY_CLIENT_TOKEN: "{{ gev_mapillary_client_token }}"
          AISSTREAM_API_KEY: "{{ gev_aisstream_api_key }}"
          OPENSKY_CLIENT_ID: "{{ gev_opensky_client_id }}"
          OPENSKY_CLIENT_SECRET: "{{ gev_opensky_client_secret }}"
          FIRMS_MAP_KEY: "{{ gev_firms_map_key }}"
          TOMTOM_API_KEY: "{{ gev_tomtom_api_key }}"
          # Startup view, lat,lon[,height_m]; blank = Austin. Kept in SOPS so
          # the public repo never says where home is.
          GEV_HOME_VIEW: "{{ gev_home_view }}"
          # mcp-auth sidecar: Authelia client for the claude.ai connector.
          GEV_MCP_CLIENT_SECRET: "{{ authelia_oidc_client_secret_gev_mcp }}"
  tasks:
    - name: Write rendered Secrets (plaintext) to the caller's private temp file
      ansible.builtin.copy:
        content: "{{ k8s_secrets | to_json }}"
        dest: "{{ render_out }}"
        mode: "0600"
      no_log: true
