---
# Provision the PiKVM (Raspberry Pi 4, Arch Linux ARM, kvmd) that is wired to
# the PVE host's ATX power/reset/LED headers. It's the out-of-band fallback
# for the host hangs in docs/pve-host-hangs.md, so this playbook keeps it
# locked down and observable. It doesn't try to manage the appliance's OS:
#
#   - No package installs or upgrades. PiKVM OS is Arch: installing one
#     package against a freshly synced repo is an unsupported partial upgrade.
#     OS updates stay manual via `pikvm-update`.
#   - No Alloy, and node_exporter only for pending updates. kvmd's built-in
#     Prometheus export covers reachability, the host's power LED,
#     temperature and throttling, and the journal is volatile (RAM) on the
#     read-only rootfs. The one thing kvmd can't report is pending OS
#     updates, so a textfile-only node_exporter (upstream binary in
#     /usr/local/bin, not a pacman package) serves the output of
#     pacman-updates-textfile.sh. That check syncs into a throwaway db under
#     /tmp and never touches pacman's real sync state.
#   - Web UI passwords (`kvmd-htpasswd`) are set by hand; any kvmd user can
#     press power/reset, so that credential isn't copied into the repo.
#
# The rootfs is mounted read-only. Every change runs between `rw` and `ro`,
# and `ro` is in an `always:` so a failed task can't leave the device
# writable. Handlers are flushed before `ro` for the same reason.

- name: PiKVM provisioning
  hosts: pikvm
  gather_facts: false

  vars:
    node_exporter_version: "1.12.1"
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBM7Y+b/BRai//GJ7Sczob/rX8ck3ArKGQP/jsR5OlWn isaac@isaaclaptop"
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMxOgEao2c+jTY4NdsEp46M9Fs8i1Yx6WiX42rUAXSJh ansible-on-nest"

  tasks:
    # pikvm-update runs pacman with the rootfs writable and reboots at the
    # end. Remounting read-only (or retrying `ro`) underneath it could break
    # the upgrade, so refuse to start while pacman holds its lock. This sits
    # outside the block, so the `always: ro` below doesn't run either.
    - name: Check no PiKVM OS update is in progress
      ansible.builtin.stat:
        path: /var/lib/pacman/db.lck
      register: pacman_lock

    - name: Stop if pacman is running
      ansible.builtin.assert:
        that: not pacman_lock.stat.exists
        fail_msg: >-
          /var/lib/pacman/db.lck exists: an update (pikvm-update / pacman) is
          running. Re-run the deploy after it finishes and the PiKVM reboots.
          If no update is running, the lock is stale; remove it by hand.
        quiet: true

    - name: Converge PiKVM config with the rootfs writable
      block:
        - name: Remount rootfs read-write
          ansible.builtin.command: rw
          changed_when: false

        - name: Deploy SSH authorized keys for root
          ansible.posix.authorized_key:
            user: root
            key: "{{ item }}"
            state: present
          loop: "{{ ssh_authorized_keys }}"

        # Key-only SSH. This sorts before 99-archlinux.conf, and sshd keeps the
        # first value it reads. If the keys ever break, the web UI's terminal
        # (kvmd login) is still a way in.
        - name: Require key-based SSH
          ansible.builtin.copy:
            content: |
              # Managed by Ansible (playbooks/provision/pikvm.yml)
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              PermitRootLogin prohibit-password
            dest: /etc/ssh/sshd_config.d/50-nest.conf
            mode: "0644"
            validate: /usr/bin/sshd -t -f %s
          notify: Reload sshd

        # Unauthenticated, read-only metrics for Prometheus. kvmd has no
        # read-only users: every htpasswd account can also press power and
        # reset. Basic auth would put a hypervisor power-button credential
        # into the monitoring LXC's config, which is worse than exposing
        # LED/temperature/throttling gauges on the LAN. Only the export
        # endpoint's auth is disabled; the web UI and API keep theirs.
        #
        # validate: a bad drop-in stops kvmd from starting, which takes the
        # web UI AND ATX control with it. Merging the candidate into the full
        # config (kvmd -m) in a scratch override dir catches YAML syntax
        # errors before it goes live. It does NOT catch misspelled keys
        # (verified 2026-09-24), which is what the post-restart check below
        # is for.
        - name: Configure kvmd overrides
          ansible.builtin.copy:
            content: |
              # Managed by Ansible (playbooks/provision/pikvm.yml)
              kvmd:
                  prometheus:
                      auth:
                          enabled: false
            dest: /etc/kvmd/override.d/50-nest.yaml
            mode: "0644"
            validate: >-
              sh -c 'd=$(mktemp -d) && cp %s "$d/50-nest.yaml"
              && kvmd -m --override-dir "$d" >/dev/null; r=$?; rm -rf "$d"; exit $r'
          notify: Restart kvmd

        # Enforce defaults the user already verified: no extra remote-control
        # protocols with their own password files.
        - name: Keep IPMI and VNC disabled
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop:
            - kvmd-ipmi
            - kvmd-vnc

        # Pending-update metrics. See the header: textfile collector only,
        # reading /run (tmpfs), so nothing it does needs the rootfs writable.
        - name: Check current node_exporter version
          ansible.builtin.command: /usr/local/bin/node_exporter --version
          register: node_exporter_version_check
          failed_when: false
          changed_when: false

        - name: Install node_exporter
          when: >-
            node_exporter_version_check.rc != 0
            or node_exporter_version not in node_exporter_version_check.stderr + node_exporter_version_check.stdout
          block:
            - name: Download and extract node_exporter
              ansible.builtin.unarchive:
                src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-arm64.tar.gz"
                dest: /tmp
                remote_src: true

            - name: Install node_exporter binary
              ansible.builtin.copy:
                src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-arm64/node_exporter"
                dest: /usr/local/bin/node_exporter
                mode: "0755"
                remote_src: true
              notify: Restart node_exporter

            - name: Clean up node_exporter download
              ansible.builtin.file:
                path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-arm64"
                state: absent

        - name: Install pending-updates script
          ansible.builtin.copy:
            src: files/pikvm/pacman-updates-textfile.sh
            dest: /usr/local/bin/pacman-updates-textfile.sh
            mode: "0755"

        - name: Deploy node_exporter and pending-updates units
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "/etc/systemd/system/{{ item.name }}"
            mode: "0644"
          loop:
            - name: node_exporter.service
              content: |
                # Managed by Ansible (playbooks/provision/pikvm.yml)
                [Unit]
                Description=Prometheus Node Exporter (textfile only)
                After=network.target

                [Service]
                Type=simple
                RuntimeDirectory=node_exporter
                RuntimeDirectoryPreserve=yes
                ExecStart=/usr/local/bin/node_exporter --collector.disable-defaults --collector.textfile --collector.textfile.directory=/run/node_exporter
                Restart=always

                [Install]
                WantedBy=multi-user.target
            - name: pacman-updates-textfile.service
              content: |
                # Managed by Ansible (playbooks/provision/pikvm.yml)
                [Unit]
                Description=Write pending PiKVM OS update metrics
                Wants=network-online.target
                After=network-online.target

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/pacman-updates-textfile.sh
            - name: pacman-updates-textfile.timer
              content: |
                # Managed by Ansible (playbooks/provision/pikvm.yml)
                [Unit]
                Description=Check for pending PiKVM OS updates

                [Timer]
                OnBootSec=10min
                OnUnitActiveSec=6h
                RandomizedDelaySec=30min

                [Install]
                WantedBy=timers.target
          loop_control:
            label: "{{ item.name }}"
          notify: Restart node_exporter

        - name: Enable node_exporter and the pending-updates timer
          ansible.builtin.systemd:
            name: "{{ item }}"
            enabled: true
            state: started
            daemon_reload: true
          loop:
            - node_exporter
            - pacman-updates-textfile.timer

        - name: Apply config changes before remounting read-only
          ansible.builtin.meta: flush_handlers

        # Proves kvmd came back after any restart, and that the override
        # really took effect: without it this endpoint returns 401/403.
        - name: Check kvmd serves Prometheus metrics without auth
          ansible.builtin.uri:
            url: https://127.0.0.1/api/export/prometheus/metrics
            validate_certs: false
            return_content: true
          register: kvmd_metrics
          retries: 10
          delay: 3
          until: kvmd_metrics.status == 200
          failed_when: >-
            kvmd_metrics.status != 200
            or 'pikvm_atx_power' not in kvmd_metrics.content

        # Writes to /run only, so it's fine here or after `ro`. Running it
        # now means the metric exists straight after a deploy.
        - name: Generate pending-update metrics now
          ansible.builtin.systemd:
            name: pacman-updates-textfile.service
            state: started

        - name: Check node_exporter serves pending-update metrics
          ansible.builtin.uri:
            url: http://127.0.0.1:9100/metrics
            return_content: true
          register: pikvm_node_metrics
          retries: 10
          delay: 3
          until: >-
            pikvm_node_metrics.status == 200
            and 'os_updates_pending{manager="pacman"}' in pikvm_node_metrics.content

      always:
        # Retried: right after a kvmd restart its services can hold rootfs
        # files open for writing for a few seconds, and the remount fails
        # with "mount point is busy". Deploy run 622 (2026-09-24) hit this,
        # possibly while a manual pikvm-update overlapped, which the pacman
        # lock check above now prevents. A persistent failure still fails
        # the job.
        - name: Remount rootfs read-only
          ansible.builtin.command: ro
          changed_when: false
          register: pikvm_ro
          retries: 12
          delay: 5
          until: pikvm_ro.rc == 0

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: node_exporter
        state: restarted
        daemon_reload: true

    - name: Reload sshd
      ansible.builtin.systemd:
        name: sshd
        state: reloaded

    # Safe for the host: ATX power/reset are momentary GPIO outputs that kvmd
    # only pulses on request, so a restart doesn't press anything.
    - name: Restart kvmd
      ansible.builtin.systemd:
        name: kvmd
        state: restarted
