groups:
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: watchdog
        annotations:
          summary: "Alerting pipeline is operational"
          description: "Weekly confirmation that Prometheus → Alertmanager → HA → phone is working."

  # Reachability alerts use majority-failure ratios (avg_over_time(up[30m]) < 0.5)
  # instead of `up == 0` + `for: 30m`. A `for` clause requires the condition on
  # every evaluation, so a single successful scrape resets the clock — a target
  # failing 90% of scrapes would never fire. Meanwhile the WireGuard scrape path
  # to the VPS drops ~6% of scrapes, which put the old form into pending
  # thousands of times per fortnight without firing. The ratio form is robust in
  # both directions: one dropped scrape can't start it, one lucky scrape can't
  # reset it.
  - name: hosts
    rules:
      - alert: HostDown
        expr: avg_over_time(up{job=~"node|vps", instance!="docker.arishaig.site"}[30m]) < 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host {{ $labels.instance }} is down"
          description: "node_exporter on {{ $labels.instance }} has failed most scrapes over the last 30 minutes."

      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.instance }}"
          description: "CPU usage is {{ printf \"%.0f\" $value }}% for 10 minutes."

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.instance }}"
          description: "Memory usage is {{ printf \"%.0f\" $value }}% for 2 hours."

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"} / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} is {{ printf \"%.0f\" $value }}% full."

      - alert: DiskSpaceCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|squashfs"} / node_filesystem_size_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} is {{ printf \"%.0f\" $value }}% full."

      - alert: DiskReadonly
        expr: node_filesystem_readonly{fstype!~"tmpfs|fuse.lxcfs|squashfs|erofs|rootfs"} == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem read-only on {{ $labels.instance }}"
          description: "{{ $labels.mountpoint }} has been mounted read-only."

  - name: services
    rules:
      - alert: CAdvisorDown
        expr: avg_over_time(up{job="cadvisor", instance!="docker.arishaig.site:8081"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "cAdvisor unreachable on {{ $labels.instance }}"
          description: "Container metrics from {{ $labels.instance }} have failed most scrapes over the last 30 minutes."

      - alert: ContainerDown
        expr: |
          time() - container_last_seen{
            job="cadvisor",
            image!="",
            name=~"/.+"
          } > 120
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has not been seen for over 30 minutes."

      # Threshold matches KubePodCrashLooping: >4 restarts in 30m means a real
      # loop, while a host reboot (one restart per container) stays quiet.
      - alert: ContainerRestarting
        expr: |
          changes(container_start_time_seconds{
            job="cadvisor",
            image!="",
            name=~"/.+"
          }[30m]) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is crash-looping"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has restarted {{ $value | printf \"%.0f\" }} times in the last 30 minutes."

      - alert: ProxmoxNodeDown
        expr: avg_over_time(up{job="proxmox"}[30m]) < 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Proxmox exporter unreachable"
          description: "pve-exporter has failed most scrapes over the last 30 minutes."

      # One resolver down is degraded redundancy, not an outage — clients fail
      # over to the remaining AdGuard instances. Warning per instance; the
      # critical page is AdGuardAllDown below.
      - alert: AdGuardDown
        expr: avg_over_time(up{job="adguard"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AdGuard Home down ({{ $labels.dns_role }})"
          description: "AdGuard Home exporter ({{ $labels.dns_role }}, {{ $labels.instance }}) has failed most scrapes over the last 30 minutes."

      - alert: AdGuardAllDown
        expr: absent(up{job="adguard"} == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "All AdGuard Home instances are unreachable"
          description: "No AdGuard exporter (primary, secondary, or tertiary) is reachable. DNS for the whole network may be down."

      - alert: QBittorrentDown
        expr: avg_over_time(up{job="qbittorrent"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "qBittorrent exporter is down"
          description: "qBittorrent metrics have failed most scrapes over the last 30 minutes."

      - alert: HomeAssistantDown
        expr: absent_over_time(alloy_build_info{servername="HomeAssistant"}[30m])
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Home Assistant metrics are down"
          description: "No metrics received from Grafana Alloy on Home Assistant in the last 30 minutes."

      - alert: ZFSPoolDegraded
        expr: node_zfs_zpool_state{instance="proxmox.local.arishaig.site", state=~"degraded|faulted|suspended|unavail"} == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} is {{ $labels.state }}"
          description: "ZFS pool {{ $labels.zpool }} on proxmox entered state {{ $labels.state }}."

      # Warning per instance for the same reason as AdGuardDown: the July 2026
      # primary-Unbound incident ran 17h at critical with zero user-visible
      # impact because the secondary carried resolution. The `or` arm catches
      # the exporter itself going unreachable, which the old `unbound_up == 0`
      # form was blind to (absent series never compares equal to 0).
      - alert: UnboundDown
        expr: |
          avg_over_time(unbound_up[30m]) < 0.5
            or avg_over_time(up{job="unbound"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unbound is down ({{ $labels.dns_role }}, {{ $labels.instance }})"
          description: "Unbound recursive resolver ({{ $labels.dns_role }}, {{ $labels.instance }}) has been failing for most of the last 30 minutes. DNS redundancy is reduced."

      - alert: UnboundAllDown
        expr: absent(unbound_up == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "All Unbound resolvers are down"
          description: "No Unbound instance (primary, secondary, or tertiary) is reporting healthy. Upstream DNS resolution is broken."

      # LXCs share the PVE host kernel, so every LXC node exporter reports the
      # same oom_kill counter — one host event used to page once per LXC.
      # Only alert from hosts that own a kernel: the PVE host (covers all
      # LXCs), the PBS VM, the DNS Pi, and the VPS.
      - alert: OOMKill
        expr: increase(node_vmstat_oom_kill{instance=~"proxmox.local.arishaig.site|backup.local.arishaig.site|dns.arishaig.site|vps-proxy"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "OOM kill on {{ $labels.instance }}"
          description: "A process was OOM-killed on {{ $labels.instance }} (for the proxmox host this includes processes inside any LXC)."

      - alert: TraefikVPSDown
        expr: avg_over_time(up{job="traefik-vps"}[30m]) < 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "VPS Traefik proxy is down"
          description: "Traefik on the VPS proxy has failed most scrapes over the last 30 minutes. All inbound traffic through the VPS is broken."

      - alert: TraefikK8sDown
        expr: avg_over_time(up{job="traefik-k8s"}[30m]) < 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "k8s Traefik ingress is down"
          description: "Traefik on the Talos k8s node has failed most scrapes over the last 30 minutes. All cluster ingress is broken."

      - alert: AutheliaDown
        expr: avg_over_time(up{job="authelia"}[30m]) < 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Authelia is down"
          description: "Authelia metrics endpoint has failed most scrapes over the last 30 minutes. Authentication for all protected services is broken."

      - alert: ValkeyDown
        expr: avg_over_time(up{job="redis"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Valkey exporter is down"
          description: "Valkey (Authelia session cache) metrics have failed most scrapes over the last 30 minutes."

      - alert: PostgresDown
        expr: avg_over_time(up{job="postgres"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres exporter is down"
          description: "Postgres (Mealie database) metrics have failed most scrapes over the last 30 minutes."

      # Lifecycle note: a deleted guest keeps firing this until its snapshots
      # age out of PBS (~5 days) — the beta/delta VM teardown (guests 113/115,
      # June 2026) paged twice a day for 5.5 days about machines that no longer
      # existed. When decommissioning a guest, prune its PBS backup group as
      # part of removal.
      - alert: PBSBackupStale
        expr: time() - pbs_backup_last_snapshot_timestamp_seconds > 30 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PBS backup stale for {{ $labels.guest_type }}/{{ $labels.guest }}"
          description: "No new PBS backup for {{ $labels.guest_type }}/{{ $labels.guest }} in over 30 hours (newest is {{ $value | humanizeDuration }} old)."

      # PBSBackupStale is `time() - <metric>`, so it can only fire once a first
      # snapshot has established the series. A backup that has never succeeded
      # produces no series at all and is therefore invisible to it — the gap
      # between "backed up" and "believes it is backed up".
      #
      # This matters specifically for the k8s-configs host backup added by the
      # 2026-07-30 backup work (architecture review B1): it is the only copy of
      # postgres, Authelia's user store and every *arr database, and unlike the
      # guest jobs it had no prior history to fall back on. 6h tolerates the
      # window between this rule deploying and the first 03:00 run.
      - alert: PBSHostBackupMissing
        expr: absent(pbs_backup_last_snapshot_timestamp_seconds{guest_type="host", guest="k8s-configs"})
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: "PBS has no k8s-configs backup at all"
          description: "The host/k8s-configs backup group does not exist in PBS. This is the only backup of the cluster's PVC data — postgres, Authelia and every *arr database. PBSBackupStale cannot catch this case because there is no series to compare against."

  - name: kubernetes
    rules:
      # Restart counts come from kube-state-metrics; AutheliaDown et al. only
      # catch sustained scrape failures, so a pod cycling every few minutes
      # (like the 2026-06-11 Authelia liveness-probe crash loop) was invisible.
      # Threshold is >4 in 30m so that node-wide single-restart events (Talos
      # upgrades, reboots, brief resource pressure) don't fan out into a page
      # per pod — the old >2-in-15m form fired ~71h across ~50 pods in one
      # fortnight, almost all of it one underlying node condition. A real
      # crash loop (CrashLoopBackOff caps at 5m) still crosses this easily.
      - alert: KubePodCrashLooping
        expr: |
          increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[30m]) > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value | printf \"%.0f\" }} times in the last 30 minutes."

      # Symptom-level coverage that crash-loop counting can't provide: a pod
      # that never starts increments no restart counter. flannel-watchdog sat
      # Pending for 10 days (July 2026) with zero alerts.
      #
      # `Failed` was added 2026-07-30 (architecture review D1). Four pods sat
      # Failed for up to nine days while every rule correctly declined to fire:
      # crash-looping keys on a restart counter that stays static once a pod is
      # stopped, and ReplicasMismatch saw no shortfall because each Deployment
      # had a healthy replica elsewhere — the Failed pods were surplus. Nothing
      # queried phase="Failed" at all.
      - alert: KubePodNotReady
        expr: |
          sum by (namespace, pod, instance) (
            kube_pod_status_phase{job="kube-state-metrics", phase=~"Pending|Unknown|Failed"}
          ) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not running"
          description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Pending, Unknown or Failed state for more than 30 minutes."

      # Kubelet node-pressure evictions. Eighteen pods — including traefik x2,
      # authelia's redis, jellyfin and four *arr apps — were evicted during the
      # 2026-07-21/22 rebuild and nothing alerted; they were only found by
      # querying kube_pod_status_reason directly during the architecture review.
      #
      # Alerts on the *delta* rather than the raw count, because evicted pod
      # objects persist until garbage-collected: a `> 0` rule would latch on
      # forever after a single event, which is the failure mode
      # KubePodCrashLooping was already retuned to escape. `or vector(0)` on
      # both sides so the rule still fires when the series is absent an hour ago
      # (i.e. the first eviction after a clean-up).
      #
      # The kube-state-metrics guard is load-bearing, not decoration. `or
      # vector(0)` cannot distinguish "no evicted pods" from "KSM was not
      # scrapeable", and KSM is single-replica. Without the guard, any KSM
      # restart makes the offset arm read 0 while the current arm reads the
      # full standing count — firing spuriously with the entire backlog. The
      # rule therefore only evaluates when KSM was up for the whole window. A
      # real eviction coinciding with a KSM restart is delayed rather than
      # lost, since evicted pod objects persist.
      - alert: KubePodEvicted
        expr: |
          (
            (count(kube_pod_status_reason{job="kube-state-metrics", reason="TerminationByKubelet"} == 1) or vector(0))
              - (count(kube_pod_status_reason{job="kube-state-metrics", reason="TerminationByKubelet"} offset 1h == 1) or vector(0))
              > 0
          )
          and on() (min_over_time(up{job="kube-state-metrics"}[1h]) == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Kubelet is evicting pods under node pressure"
          description: "{{ $value | printf \"%.0f\" }} more pod(s) have been evicted by kubelet in the last hour. Check node memory/disk pressure — evictions target BestEffort pods first, which on this cluster means traefik, authelia and the storage provisioners."

      # The leading indicator for the above. Silent today (no node reports
      # pressure), so it costs nothing until it matters.
      - alert: KubeNodeUnderPressure
        expr: |
          kube_node_status_condition{job="kube-state-metrics", condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"
          description: "Node {{ $labels.node }} has reported {{ $labels.condition }} for more than 10 minutes. Kubelet will start evicting pods if this persists."

      # 30m tolerates slow rollouts (large image pulls) while catching
      # deployments that quietly lose all replicas.
      - alert: KubeDeploymentReplicasMismatch
        expr: |
          kube_deployment_spec_replicas{job="kube-state-metrics"}
            > kube_deployment_status_replicas_available{job="kube-state-metrics"}
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} is under-replicated"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has had fewer available replicas than desired for more than 30 minutes."

      # talos-omega is the user's gaming PC, dual-booted between Windows and
      # Talos — it's routinely offline for hours at a time whenever the owner
      # reboots into Windows to game. That's expected, not an incident, so
      # it's excluded here the same way docker.arishaig.site is excluded from
      # HostDown above for being intentionally stopped.
      - alert: KubeNodeNotReady
        expr: kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node!="talos-omega"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is NotReady"
          description: "Kubernetes node {{ $labels.node }} has been NotReady for more than 10 minutes."

      # If kube-state-metrics itself dies, KubePodCrashLooping goes silently
      # blind — page on that rather than discovering it during an incident.
      - alert: KubeStateMetricsDown
        expr: avg_over_time(up{job="kube-state-metrics"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "kube-state-metrics is down"
          description: "kube-state-metrics has failed most scrapes over the last 30 minutes. Pod crash-loop alerting is blind until it recovers."

      # --- control plane ------------------------------------------------------
      # The cluster has a single control-plane node (talos-alpha-control, 4
      # vCPU / 12GB as of the 2026-08-28 bump). When its kube-apiserver goes
      # latency-bound, the failure fans out into a dozen unrelated-looking
      # warnings — every Flux controller drops its leader-election lease and
      # crash-loops, kube-state-metrics fails its liveness probe (can't LIST)
      # and takes all KSM-derived alerting blind, the csi-nfs sidecars
      # crash-loop, and KubePodCrashLooping pages once per affected pod. These
      # two rules page on the cause instead, at critical, so an apiserver
      # incident is one legible alert rather than a scroll of symptoms.
      #
      # kube-scheduler and kube-controller-manager are static pods that share
      # the node (and usually the fate) of the apiserver, so their health is a
      # usable proxy for "the control plane is unwell" — the apiserver itself
      # is deliberately not a scrape target (see the API VIP note in
      # prometheus.yml.j2). Both rules key on KSM, so they inherit its
      # blind spots during a total apiserver outage; they still fire on the
      # far more common partial/latency case, which is exactly the 2026-08-28
      # signature.
      - alert: KubeControlPlaneComponentDown
        expr: |
          max by (namespace, pod) (
            kube_pod_status_ready{job="kube-state-metrics", namespace="kube-system", condition="true", pod=~"kube-scheduler-.*|kube-controller-manager-.*"}
          ) < 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Control-plane component {{ $labels.pod }} is not ready"
          description: "{{ $labels.pod }} has been not-ready for more than 10 minutes. On a single-control-plane cluster this usually means the apiserver on talos-alpha-control is unhealthy — expect Flux, kube-state-metrics and CSI to be crash-looping downstream."

      # Lower threshold (>2 in 30m) and higher severity than the generic
      # KubePodCrashLooping (>4, warning): a control-plane component restarting
      # even twice is a distinct critical signal, and bundling it into the
      # generic per-pod warning is what buried it on 2026-08-28.
      - alert: KubeControlPlaneComponentRestarting
        expr: |
          increase(kube_pod_container_status_restarts_total{job="kube-state-metrics", namespace="kube-system", pod=~"kube-scheduler-.*|kube-controller-manager-.*|kube-apiserver-.*"}[30m]) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Control-plane component {{ $labels.pod }} is restarting"
          description: "{{ $labels.container }} in {{ $labels.pod }} has restarted {{ $value | printf \"%.0f\" }} times in the last 30 minutes. Check apiserver/etcd health on talos-alpha-control (etcd disk-fsync latency is the usual cause on shared Proxmox storage)."

      # No separate KSM replica-availability rule is needed, contrary to
      # architecture review finding D2. That finding assumed two KSM replicas
      # behind the shared MetalLB IP, one of which could sit Failed while the
      # other answered every scrape. Verified 2026-07-30: spec_replicas is 1,
      # available is 1. At a single replica there is no half-dead state — if it
      # dies, `up` goes to 0 and KubeStateMetricsDown fires correctly. The
      # Failed KSM pod that prompted D2 was an evicted orphan from an earlier
      # rollout, not a second replica, and is covered by KubePodNotReady above.
      # Should KSM ever be scaled up, KubeDeploymentReplicasMismatch already
      # covers replica shortfall for every deployment, KSM included.

  - name: flux
    rules:
      # Before this group the estate had zero Flux reconcile alerting. On
      # 2026-08-30 the gpu-operator v26.7.0 HelmRelease wedged, the
      # infrastructure Kustomization went Ready=False, and — because apps
      # dependsOn infrastructure — nothing in k8s/apps/** deployed for ~2 days
      # with no signal at all. infrastructure no longer gates on HelmRelease
      # health (wait: false), so these per-object rules are now the primary
      # "GitOps has stopped delivering" signal.

      # If the Flux metrics scrape itself is down, the two rules below go
      # blind — same rationale as KubeStateMetricsDown.
      - alert: FluxControllerDown
        expr: avg_over_time(up{job="flux"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Flux {{ $labels.controller }} metrics are unreachable"
          description: "Prometheus has failed most scrapes of {{ $labels.controller }} ({{ $labels.instance }}) over the last 30 minutes (via the 192.168.1.116 metrics IP). FluxKustomizationNotReady / FluxHelmReleaseNotReady are blind until it recovers."

      # A Kustomization stuck Ready=False = changes in that path have stopped
      # applying. 30m warning clears normal reconcile blips; 2h critical means
      # a real stall like the gpu-operator incident. Suspended Kustomizations
      # (e.g. during a break-glass) are excluded.
      - alert: FluxKustomizationNotReady
        expr: |
          max by (name, namespace) (
            gotk_reconcile_condition{job="flux", kind="Kustomization", type="Ready", status="False"}
          ) == 1
          unless on (name, namespace) gotk_suspend_status{job="flux", kind="Kustomization"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Flux Kustomization {{ $labels.name }} has been not-Ready for 30m"
          description: "Kustomization {{ $labels.namespace }}/{{ $labels.name }} is Ready=False — changes under its path are not being applied. Check `flux get kustomization {{ $labels.name }}` and the object it is stalled on."

      - alert: FluxKustomizationStalled
        expr: |
          max by (name, namespace) (
            gotk_reconcile_condition{job="flux", kind="Kustomization", type="Ready", status="False"}
          ) == 1
          unless on (name, namespace) gotk_suspend_status{job="flux", kind="Kustomization"} == 1
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "Flux Kustomization {{ $labels.name }} has been not-Ready for 2h"
          description: "Kustomization {{ $labels.namespace }}/{{ $labels.name }} has been Ready=False for 2 hours. GitOps delivery for its path is stalled — this is the class of failure that froze `apps` for 2 days in Aug 2026."

      # HelmReleases legitimately sit not-Ready longer during install/upgrade,
      # so 1h before warning. Suspended releases excluded.
      - alert: FluxHelmReleaseNotReady
        expr: |
          max by (name, namespace) (
            gotk_reconcile_condition{job="flux", kind="HelmRelease", type="Ready", status="False"}
          ) == 1
          unless on (name, namespace) gotk_suspend_status{job="flux", kind="HelmRelease"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Flux HelmRelease {{ $labels.name }} has been not-Ready for 1h"
          description: "HelmRelease {{ $labels.namespace }}/{{ $labels.name }} is Ready=False (install/upgrade failed or stalled). Check `flux get helmrelease -n {{ $labels.namespace }} {{ $labels.name }}` and its Helm history."

  - name: endpoints
    rules:
      # This is the true user-facing symptom alert (probes the public path),
      # so it uses a tighter 15m window than the scrape-path rules — it pages
      # in ~20 minutes instead of 30+ while staying flap-proof.
      - alert: ExternalEndpointDown
        expr: avg_over_time(probe_success{job="blackbox"}[15m]) < 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "External endpoint {{ $labels.instance }} is unreachable"
          description: "{{ $labels.instance }} has failed most probes over the last 15 minutes. DNS, Cloudflare, VPS proxy, or the service itself may be down."

      # blackbox_exporter's http prober always exposes probe_ssl_earliest_cert_expiry
      # for https targets, regardless of module config — no new scrape needed.
      # TLS passes through the VPS untouched (see
      # playbooks/provision/files/vps/traefik/dynamic/tcp-passthrough.yml) to
      # k8s Traefik, the sole terminator, which serves one wildcard
      # *.arishaig.site cert off one TLSStore for every route here — so every
      # target genuinely shares one expiry. Aggregated with min() rather than
      # per-instance (unlike ExternalEndpointDown) so a renewal failure pages
      # once instead of ~24 times; group_by: ['alertname', 'instance'] in
      # alertmanager.yml.j2 would not otherwise collapse per-instance alerts,
      # and this is exactly the notification-storm pattern PR #290 fixed.
      - alert: CertificateExpiringSoon
        expr: min(probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 14
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The *.arishaig.site TLS cert expires in under 14 days"
          description: "The shared wildcard cert expires in {{ $value | humanize }} days. cert-manager/ACME renewal should have already fired well before this — check the Certificate resource and cert-manager logs (`kubectl -n traefik describe certificate`)."

      - alert: CertificateExpiringCritical
        expr: min(probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 3
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "The *.arishaig.site TLS cert expires in under 3 days"
          description: "The shared wildcard cert expires in {{ $value | humanize }} days. Renewal has failed — every route on *.arishaig.site is about to start failing TLS handshakes."

  - name: network
    rules:
      - alert: UnpollerNoData
        expr: absent(unpoller_client_uptime_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Unpoller is not collecting client metrics"
          description: "No unpoller_client_uptime_seconds series for 30 minutes — unpoller may be failing to reach the UniFi controller."

  - name: media
    rules:
      # This watches the *arr Prometheus exporters behind the shared MetalLB IP
      # (192.168.1.116), not the apps themselves. The exporter target can go
      # unscrapeable while the app is fully up — a flapping MetalLB speaker
      # lease, a slow exporter sidecar, or the LB IP briefly losing its L2
      # announcement all trip this without the app ever being down. The
      # user-facing "is the app actually reachable" signal is ExternalEndpointDown
      # (blackbox probes the public https:// path). Word the annotations for the
      # scrape path so a green web UI plus this alert doesn't read as a
      # contradiction.
      - alert: MediaAppExporterDown
        expr: avg_over_time(up{job=~"sonarr|radarr|lidarr|prowlarr|bazarr"}[30m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} exporter is unreachable"
          description: "Prometheus has failed most scrapes of the {{ $labels.job }} exporter ({{ $labels.instance }}) over the last 30 minutes. This is the metrics scrape path (via the 192.168.1.116 MetalLB IP), not the app — check ExternalEndpointDown to see whether {{ $labels.job }} itself is actually down."

      # subgen (GPU Whisper on talos-omega) crash-loops on a native SIGSEGV
      # in CTranslate2 during [TRANSCRIBE] jobs. Its shell wrapper exits 0
      # after the segfault, so the pod's last state is "Completed" — no
      # CrashLoopBackOff, no restart backoff — and the crash cadence
      # (~1 per 12-16min) sits just under KubePodCrashLooping's >4-in-30m
      # threshold, so 3+ days of restarts went completely unalerted. Longer
      # window, lower rate: >6 restarts in 3h is a sustained loop, while a
      # deploy or an omega reboot-into-Windows (expected — see the
      # KubeNodeNotReady omega exclusion) is a single restart. Warning, not
      # critical: subgen is degraded-but-progressing, not an outage.
      - alert: SubgenChronicRestart
        expr: increase(kube_pod_container_status_restarts_total{job="kube-state-metrics", namespace="media", pod=~"subgen-.*"}[3h]) > 6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "subgen is chronically restarting on talos-omega"
          description: "subgen has restarted {{ $value | printf \"%.0f\" }} times in the last 3 hours — below KubePodCrashLooping's threshold but a sustained loop. Almost certainly the CTranslate2 SIGSEGV during [TRANSCRIBE]; check GPU metrics (job dcgm) for VRAM/thermal/Xid correlation and the subgen.yaml COMPUTE_TYPE / WHISPER_MODEL notes."

  - name: logging
    rules:
      # Replaces the old self-referential LokiIngestionBackpressure ruler alert.
      # loki_discarded_samples_total is the authoritative drop counter (by reason),
      # so this catches real rate-limit/per-stream drops that the log-scrape never did.
      - alert: LokiDiscardingLogs
        expr: sum(increase(loki_discarded_samples_total[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is discarding log samples"
          description: "Loki has dropped {{ $value | printf \"%.0f\" }} log samples in the last 15 minutes (rate or per-stream limits). Log-based alerts may be unreliable; check loki_discarded_samples_total by reason."

      # Catches Loki degrading in place (slow ingester, 500s on push) — the
      # 2026-06-11 incident had zero discards but 10s+ pushes failing for
      # hours, which LokiDiscardingLogs can't see.
      - alert: LokiPushErrors
        expr: sum(increase(loki_request_duration_seconds_count{route="loki_api_v1_push", status_code=~"5.."}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is failing log push requests"
          description: "Loki returned {{ $value | printf \"%.0f\" }} 5xx responses to push requests in the last 15 minutes. Ingestion is degraded and Loki ruler alerts may be unreliable."

      # Loki can serve /metrics (so up{job="loki"} stays 1) while /ready
      # returns 503 and the ruler stops evaluating — which silently disables
      # the entire Loki-ruler alert family (LogIngestionGap, SystemdUnitFailed,
      # the security rules, GluetunVPNError). Same watchman logic as
      # KubeStateMetricsDown: alert on the alerting path itself. Probed via
      # blackbox because readiness is not exposed as a metric.
      - alert: LokiNotReady
        expr: avg_over_time(probe_success{job="blackbox-internal", instance="http://loki:3100/ready"}[15m]) < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is not ready"
          description: "Loki's /ready endpoint has been failing for most of the last 15 minutes. Loki-ruler alerts (log ingestion gaps, systemd failures, security rules) may be silently disabled."
