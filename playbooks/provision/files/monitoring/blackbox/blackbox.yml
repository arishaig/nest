modules:
  http_endpoint:
    prober: http
    timeout: 10s
    http:
      # Accept any response that indicates the full path is working —
      # many services redirect to Authelia (302) or return 401/403.
      valid_status_codes: [200, 201, 301, 302, 303, 307, 308, 401, 403]
      follow_redirects: false
      preferred_ip_protocol: ip4

  # Asks a resolver for a real name and requires NOERROR. The Pis' Unbound can
  # die or wedge while AdGuard keeps answering SERVFAIL for everything (2026-10-23:
  # 11 h, ~half of cluster lookups failed because clients do not fail over on
  # SERVFAIL), which unbound_up and up{job="unbound"} did not catch in time.
  dns_resolver:
    prober: dns
    timeout: 5s
    dns:
      query_name: example.com
      query_type: A
      valid_rcodes: [NOERROR]
      preferred_ip_protocol: ip4
