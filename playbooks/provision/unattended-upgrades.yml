---
# Daily automatic security updates for the Debian hosts (LXCs, the AdGuard Pi
# and dns-secondary). The policy lives here; each host applies it itself via
# apt-daily-upgrade.timer.
#
#   - Debian-Security only. Point releases, third-party repos (docker-ce,
#     nodesource, the Raspberry Pi Foundation kernel) and everything else
#     wait for the manual "guests" run of .github/workflows/maintenance.yml.
#   - Never reboots. OSRebootRequired alerts when a host with its own kernel
#     needs one; the LXCs share the PVE host's kernel.
#   - The two DNS servers upgrade at different times, so an unbound security
#     restart can't take both resolvers down at once.
#
# Whether it's working shows up in Prometheus: OSSecurityUpdatesPending
# (update-metrics.yml) fires if security updates sit for 2 days.
#
# It also keeps the apt sources on these hosts sane, since unattended and
# maintenance upgrades both depend on `apt update` succeeding: it removes the
# stale HashiCorp repo and pins Docker's repo to each host's own release.
#
# The VPS (dns-tertiary / vps-proxy) keeps the stock Debian policy set up in
# vps.yml. PVE and PBS are never updated unattended: see maintenance.yml.

- name: Unattended security upgrades
  hosts: lxcs:dns:!dns-tertiary
  become: true
  gather_facts: true
  gather_subset: [min]

  vars:
    # Local time. The stock timer runs 06:00 plus up to 60m random delay.
    dns_upgrade_times:
      adguard: "04:00"
      dns-secondary: "05:30"

  tasks:
    # ci and monitoring had HashiCorp's repo added by hand for terraform,
    # which nothing uses since the move to OpenTofu (runner.yml installs
    # tofu). HashiCorp rotated its signing key in 2026-09, so that repo fails
    # verification and makes every `apt update` here and in update_apt.yml
    # fail. Remove it and the unused package, before the cache refresh below.
    - name: Remove the stale HashiCorp repo
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/hashicorp.list
        - /usr/share/keyrings/hashicorp-archive-keyring.asc

    - name: Remove unused terraform package
      ansible.builtin.apt:
        name: terraform
        state: absent

    # The per-host playbooks only add Docker's repo when Docker isn't
    # installed yet, so hosts upgraded bookworm -> trixie kept pulling
    # bookworm builds (monitoring, scrutiny, seedbox, dns-secondary as of
    # 2026-09-25), in files with three different names. Keep one
    # docker.sources per host that has the repo, on the host's own release.
    # (find matches `contains` from the start of each line, hence the .*)
    - name: Find Docker apt repo files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "*.list,*.sources"
        contains: '.*download\.docker\.com'
      register: docker_repo_files

    - name: Pin the Docker repo to this host's release
      when: docker_repo_files.matched > 0
      block:
        - name: Create /etc/apt/keyrings
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Install Docker's signing key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/debian/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Write docker.sources
          ansible.builtin.copy:
            content: |
              # Managed by Ansible (playbooks/provision/unattended-upgrades.yml)
              Types: deb
              URIs: https://download.docker.com/linux/debian
              Suites: {{ ansible_facts['distribution_release'] }}
              Components: stable
              Architectures: {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}
              Signed-By: /etc/apt/keyrings/docker.asc
            dest: /etc/apt/sources.list.d/docker.sources
            mode: "0644"

        - name: Remove other Docker repo files
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ docker_repo_files.files }}"
          loop_control:
            label: "{{ item.path }}"
          when: item.path != '/etc/apt/sources.list.d/docker.sources'

    # Refresh first: until 20auto-upgrades (below) exists, apt-daily.timer
    # fires but doesn't update the lists, so some hosts had lists months old
    # and the install 404'd on superseded dependency versions.
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Turn on daily list updates and unattended upgrades
      ansible.builtin.copy:
        content: |
          // Managed by Ansible (playbooks/provision/unattended-upgrades.yml)
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"

    # apt config lists add up across files, so without the #clear lines the
    # stock 50unattended-upgrades origins (which include point releases)
    # would still apply. This file sorts after 50, so it wins.
    - name: Limit unattended upgrades to Debian security
      ansible.builtin.copy:
        content: |
          // Managed by Ansible (playbooks/provision/unattended-upgrades.yml)
          #clear Unattended-Upgrade::Origins-Pattern;
          #clear Unattended-Upgrade::Allowed-Origins;
          Unattended-Upgrade::Origins-Pattern {
                  "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };
          Unattended-Upgrade::Automatic-Reboot "false";
        dest: /etc/apt/apt.conf.d/52nest-unattended-upgrades
        mode: "0644"

    - name: Check the effective origins are security-only
      ansible.builtin.command: apt-config dump Unattended-Upgrade::Origins-Pattern
      register: uu_origins
      changed_when: false
      failed_when: >-
        uu_origins.stdout_lines | select('search', '::Origins-Pattern:: ') | list | length != 1
        or 'Debian-Security' not in uu_origins.stdout

    - name: Stagger the DNS servers' upgrade time
      when: inventory_hostname in dns_upgrade_times
      block:
        - name: Create apt-daily-upgrade.timer drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/apt-daily-upgrade.timer.d
            state: directory
            mode: "0755"

        # The empty OnCalendar= clears the stock schedule; without it both run.
        - name: Set the upgrade time
          ansible.builtin.copy:
            content: |
              # Managed by Ansible (playbooks/provision/unattended-upgrades.yml)
              [Timer]
              OnCalendar=
              OnCalendar=*-*-* {{ dns_upgrade_times[inventory_hostname] }}
              RandomizedDelaySec=15m
            dest: /etc/systemd/system/apt-daily-upgrade.timer.d/nest.conf
            mode: "0644"
          notify: Restart apt-daily-upgrade timer

    - name: Enable the apt timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

  handlers:
    - name: Restart apt-daily-upgrade timer
      ansible.builtin.systemd:
        name: apt-daily-upgrade.timer
        state: restarted
        daemon_reload: true
