---
# Provision k8s cluster state that cannot live in git (secrets).
# Idempotent: uses kubectl apply with --dry-run=client to detect drift,
# then applies only if the secret would change.
#
# Requires: inventory/group_vars/all.sops.yaml + the age key (docs/secrets.md)
# Requires: kubectl configured and pointing at the Talos cluster

- name: K8s secrets provisioning
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create media namespace secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.name }}"
            namespace: media
          type: Opaque
          stringData: "{{ item.data }}"
      loop:
        - name: postgres-secret
          data:
            POSTGRES_USER: "{{ mealie_postgres_user }}"
            POSTGRES_PASSWORD: "{{ mealie_postgres_password }}"
        # Jellyfin's own non-superuser role on the shared postgres, owning
        # only the `jellyfin` DB (postgres-secret is Mealie's superuser).
        - name: jellyfin-postgres-secret
          data:
            POSTGRES_USER: "{{ jellyfin_postgres_user }}"
            POSTGRES_PASSWORD: "{{ jellyfin_postgres_password }}"
        # Per-app non-superuser roles on the shared postgres for the apps
        # moving off SQLite (docs/media-postgres-migration.md). Each owns only
        # <app>-main and <app>-log (Seerr and Bazarr: one DB). Generated by
        # scripts/gen-pg-app-secrets.sh.
        - name: prowlarr-postgres-secret
          data:
            POSTGRES_USER: "{{ prowlarr_postgres_user }}"
            POSTGRES_PASSWORD: "{{ prowlarr_postgres_password }}"
        - name: radarr-postgres-secret
          data:
            POSTGRES_USER: "{{ radarr_postgres_user }}"
            POSTGRES_PASSWORD: "{{ radarr_postgres_password }}"
        - name: sonarr-postgres-secret
          data:
            POSTGRES_USER: "{{ sonarr_postgres_user }}"
            POSTGRES_PASSWORD: "{{ sonarr_postgres_password }}"
        - name: bazarr-postgres-secret
          data:
            POSTGRES_USER: "{{ bazarr_postgres_user }}"
            POSTGRES_PASSWORD: "{{ bazarr_postgres_password }}"
        - name: seerr-postgres-secret
          data:
            POSTGRES_USER: "{{ seerr_postgres_user }}"
            POSTGRES_PASSWORD: "{{ seerr_postgres_password }}"
        - name: lidarr-postgres-secret
          data:
            POSTGRES_USER: "{{ lidarr_postgres_user }}"
            POSTGRES_PASSWORD: "{{ lidarr_postgres_password }}"
        - name: lidarr-api-key
          data:
            APIKEY: "{{ lidarr_api_key }}"
        - name: bazarr-api-key
          data:
            APIKEY: "{{ bazarr_api_key }}"
        # Digarr (docs/music-digarr.md): encrypts stored connector tokens at
        # rest. Deliberately no Lidarr key — discovery-only trial.
        - name: digarr-secret
          data:
            DIGARR_ENCRYPTION_KEY: "{{ digarr_encryption_key }}"
        - name: prowlarr-api-key
          data:
            APIKEY: "{{ prowlarr_api_key }}"
        # AudioMuse-AI (docs/music-audiomuse.md). JELLYFIN_TOKEN is a
        # dedicated Jellyfin API key, not jellyfin_api_key (nest-mcp's), so
        # it can be revoked on its own.
        - name: audiomuse-secret
          data:
            POSTGRES_PASSWORD: "{{ audiomuse_postgres_password }}"
            JELLYFIN_USER_ID: "{{ audiomuse_jellyfin_user_id }}"
            JELLYFIN_TOKEN: "{{ audiomuse_jellyfin_token }}"
        - name: subgen-secrets
          data:
            HF_TOKEN: "{{ hugging_face_access_token }}"
        - name: sonarr-api-key
          data:
            APIKEY: "{{ sonarr_api_key }}"
        - name: radarr-api-key
          data:
            APIKEY: "{{ radarr_api_key }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Create cert-manager namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: cert-manager

    - name: Create cert-manager cloudflare API token secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: cloudflare-api-token
            namespace: cert-manager
          type: Opaque
          stringData:
            api-token: "{{ traefik_cf_dns_api_token }}"
      no_log: true

    - name: Create authelia namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: authelia

    - name: Create authelia env secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authelia-env-secret
            namespace: authelia
          type: Opaque
          stringData:
            AUTHELIA_SESSION_SECRET: "{{ authelia_session_secret }}"
            AUTHELIA_STORAGE_ENCRYPTION_KEY: "{{ authelia_storage_encryption_key }}"
            AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "{{ authelia_jwt_secret }}"
      no_log: true

    - name: Create authelia config secret (rendered configuration.yml)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: authelia-config
            namespace: authelia
          type: Opaque
          stringData:
            configuration.yml: "{{ lookup('template', 'templates/k8s/authelia-configuration.yml.j2') }}"
      no_log: true

    - name: Create authelia users ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: authelia-users
            namespace: authelia
          data:
            users_database.yml: "{{ lookup('template', 'templates/docker/authelia-users.yml.j2') }}"

    - name: Create nest-mcp namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: nest-mcp

    - name: Create nest-mcp app secrets
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: nest-mcp-secrets
            namespace: nest-mcp
          type: Opaque
          stringData:
            NEST_PROXMOX_TOKEN: "{{ nest_mcp_pve_token }}"
            NEST_VPS_VULTR_API_KEY: "{{ vultr_api_key }}"
            NEST_PBS_PASSWORD: "{{ pbs_password }}"
            NEST_UNIFI_USERNAME: "{{ unpoller_unifi_user }}"
            NEST_UNIFI_PASSWORD: "{{ unpoller_unifi_pass }}"
            NEST_ADGUARD_PASSWORD: "{{ adguard_admin_password }}"
            NEST_HA_TOKEN: "{{ homeassistant_bearer_token }}"
            NEST_GRAFANA_PASSWORD: "{{ grafana_admin_password }}"
            NEST_SONARR_KEY: "{{ sonarr_api_key }}"
            NEST_RADARR_KEY: "{{ radarr_api_key }}"
            NEST_LIDARR_KEY: "{{ lidarr_api_key }}"
            NEST_PROWLARR_KEY: "{{ prowlarr_api_key }}"
            NEST_JELLYSEERR_KEY: "{{ jellyseerr_api_key }}"
            NEST_JELLYFIN_KEY: "{{ jellyfin_api_key }}"
            NEST_MEALIE_KEY: "{{ nest_mcp_mealie_token }}"
            NEST_K8S_TOKEN: "{{ k8s_mcp_sa_token }}"
            MCP_PORT: "8765"
            MCP_AUTHELIA_ISSUER: "https://auth.arishaig.site"
            MCP_CLIENT_ID: "nest-mcp"
            MCP_CLIENT_SECRET: "{{ authelia_oidc_client_secret_nest_mcp }}"
      no_log: true

    - name: Create nest-mcp SSH key secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: nest-mcp-ssh-key
            namespace: nest-mcp
          type: Opaque
          stringData:
            ansible-on-nest: "{{ nest_mcp_ssh_private_key }}"
      no_log: true
