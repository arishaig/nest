---
# Push the one k8s Secret that can't live in git as a SOPS manifest: Flux's
# own decryption key (flux-system/sops-age). Every other Secret is generated
# into k8s/**/*.sops.yaml from k8s-secrets.yml and reconciled by Flux
# (docs/secrets.md).
#
# Requires: inventory/group_vars/all.sops.yaml + the age key (docs/secrets.md)
# Requires: kubectl configured and pointing at the Talos cluster

- name: K8s secrets provisioning
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # The age key Flux's kustomize-controller decrypts SOPS-encrypted
    # manifests with (docs/secrets.md). The only Secret this playbook pushes:
    # every other k8s Secret is a *.sops.yaml in k8s/, reconciled by Flux
    # (spec: k8s-secrets.yml). The `.agekey` suffix is how Flux recognises an
    # age key.
    - name: Create Flux SOPS age key secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sops-age
            namespace: flux-system
          type: Opaque
          stringData:
            age.agekey: "{{ sops_age_key }}"
      no_log: true
