---
# Provision the PVE host itself (not the LXCs/VMs it runs).
# Covers: ZFS datasets and NFS exports for k8s and media storage.

- name: PVE host provisioning
  hosts: pve
  become: true
  gather_facts: false

  vars:
    # External dead-man's-switch ping URL (e.g. a healthchecks.io check).
    # Empty = heartbeat disabled; see docs/pve-host-hangs.md.
    pve_heartbeat_url: "{{ vault_pve_heartbeat_url | default('') }}"
    # Scheduled etcd snapshot of the sole control plane. talosctl is pinned
    # to the cluster's Talos version; the checksum comes from the release's
    # sha256sum.txt and must change with the version.
    talosctl_version: "1.14.4"
    talosctl_sha256: "0a69e3f9b682c5cd844b78dae305f6056ceb86c5fcc6913dcea78c527ed97cee"
    etcd_backup_dir: /Tank/etcd-backups
    etcd_backup_cp_ip: 192.168.1.119
    # Client config minted with `talosctl config new --roles os:etcd:backup`
    # (snapshot only; 1-year cert, renew before it lapses — the stale alert
    # fires when it does). Empty = snapshots disabled.
    etcd_backup_config: "{{ vault_talos_etcd_backup_config | default('') }}"

  tasks:
    - name: Deploy IP-based NTP fallbacks for chrony
      ansible.builtin.copy:
        content: |
          server 129.6.15.28 iburst
          server 129.6.15.29 iburst
          server 129.6.15.30 iburst
          server 129.6.15.31 iburst
        dest: /etc/chrony/sources.d/ip-fallback.sources
        mode: "0644"
      notify: Restart chrony

    # Without a cap, ARC competes with VM memory; the host OOM-killed the PBS
    # VM (2026-06-11) when VMs + ARC exceeded physical RAM.
    - name: Cap ZFS ARC at 8 GiB (persistent)
      ansible.builtin.copy:
        content: |
          options zfs zfs_arc_max=8589934592
        dest: /etc/modprobe.d/zfs.conf
        mode: "0644"
      notify: Update initramfs

    - name: Cap ZFS ARC at 8 GiB (runtime, no reboot needed)
      ansible.builtin.shell: |
        if [ "$(cat /sys/module/zfs/parameters/zfs_arc_max)" != "8589934592" ]; then
          echo 8589934592 > /sys/module/zfs/parameters/zfs_arc_max
          echo changed
        fi
      register: arc_runtime
      changed_when: "'changed' in arc_runtime.stdout"

    # The no-subscription repo is already configured in proxmox.sources;
    # the enterprise repo 401s without a subscription and fails the daily
    # aptupdate task. PVE upgrades have re-created it before, so keep it
    # absent here rather than fixing it by hand.
    - name: Remove the unusable pve-enterprise apt repo
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/pve-enterprise.list

    # Back up every guest instead of a hardcoded vmid list so new VMs/LXCs
    # are covered automatically. VM 500 is PBS itself — backing it up into
    # its own datastore is circular, so it stays excluded.
    #
    # bwlimit caps read/transfer throughput at 100 MiB/s (2026-08-03): an
    # unthrottled --all run was saturating local-zfs badly enough that
    # talos-alpha-control's etcd WAL fsyncs stalled ~10s, blowing leader
    # election timeouts and crash-looping kube-scheduler/kube-controller-
    # manager. Pairs with PBS's own 150 MiB/s write throttle (vm-pbs.tf).
    - name: Switch the vzdump job to all guests with PBS excluded and bwlimit set
      ansible.builtin.shell: |
        if ! grep -qE '^\s+all 1$' /etc/pve/jobs.cfg || ! grep -qE '^\s+exclude 500$' /etc/pve/jobs.cfg || ! grep -qE '^\s+bwlimit 102400$' /etc/pve/jobs.cfg; then
          pvesh set /cluster/backup/backup-c4e43015-c035 --all 1 --exclude 500 --bwlimit 102400 --delete vmid
          echo changed
        fi
      register: vzdump_job
      changed_when: "'changed' in vzdump_job.stdout"

    - name: Install NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: false

    - name: Install media inspection tools
      # ffprobe (ffmpeg, already present) surveys audio-track language
      # tagging; mkvpropedit (mkvtoolnix) fixes it losslessly — flips
      # container disposition flags only, no re-encode/re-mux. Runs here
      # rather than on the (unprivileged) fileserver LXC because these
      # scripts need to write to files owned by arbitrary host UIDs
      # (root, from k8s pods writing over NFS with no_root_squash) that
      # fall outside that LXC's uid-mapped range and show up as
      # nobody:nogroup there — PVE, as the actual ZFS pool owner, is real
      # root against every file regardless of who wrote it.
      ansible.builtin.apt:
        name:
          - ffmpeg
          - mkvtoolnix
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install ncdu
      # Backs nest-mcp's media_ls tool, which shells out to ncdu on PVE to
      # walk the media NFS share with ZFS-compression-aware directory sizes.
      ansible.builtin.apt:
        name: ncdu
        state: present
        update_cache: false

    - name: Deploy audio-language survey/fix scripts
      # Back nest-mcp's media_audio_lang_survey (read-only) and
      # media_audio_lang_fix (mkvpropedit, defaults to dry-run) tools, and can
      # also be run by hand. audio_lang_common.py holds the shared
      # ffprobe/classification logic both scripts import.
      ansible.builtin.copy:
        src: files/pve/
        dest: /usr/local/bin/
        mode: "0755"

    - name: Create k8s config ZFS dataset
      community.general.zfs:
        name: rpool/data/k8s-configs
        state: present

    - name: Manage NFS exports
      ansible.builtin.template:
        src: templates/pve/exports.j2
        dest: /etc/exports
        owner: root
        group: root
        mode: "0644"
      notify: Reload exports

    # cold-storage and cold-backup are plain directories on rpool/ROOT/pve-1
    # (confirmed via findmnt — neither is a separate mount or pool), so the
    # names read as offsite/offline capacity during exactly the incident
    # where someone would reach for it (architecture-review.md B3). Renaming
    # is a pvesm remove+add of the storage definition; the underlying path
    # and its contents are untouched, so nothing is migrated or lost.
    - name: Rename cold-storage to local-archive-1
      ansible.builtin.shell: |
        if pvesm status --storage cold-storage >/dev/null 2>&1; then
          pvesm remove cold-storage
          pvesm add dir local-archive-1 --path /mnt/cold-storage --content backup --shared 0 --prune-backups keep-all=1
          echo changed
        fi
      register: rename_cold_storage
      changed_when: "'changed' in rename_cold_storage.stdout"

    - name: Rename cold-backup to local-archive-2
      ansible.builtin.shell: |
        if pvesm status --storage cold-backup >/dev/null 2>&1; then
          pvesm remove cold-backup
          pvesm add dir local-archive-2 --path /mnt/cold-backup --content backup --shared 0 --prune-backups keep-all=1
          echo changed
        fi
      register: rename_cold_backup
      changed_when: "'changed' in rename_cold_backup.stdout"

    # The host hard-hangs (fans spinning, unresponsive) every ~13d23h15m, and
    # each hang lasted 2-8.5h until someone reset it by hand (Jul-Sep 2026,
    # see docs/pve-host-hangs.md). watchdog-mux is always running and feeding
    # a watchdog, but the default softdog lives inside the kernel and dies
    # with it. The B450's FCH TCO timer is real hardware and resets the board
    # ~10s after watchdog-mux stops feeding it (verified to initialize via
    # MMIO on 2026-09-23). The Proxmox blacklist is fine as-is: watchdog-mux
    # modprobes the configured module itself.
    #
    # No restart handler on purpose: /dev/watchdog stays bound to softdog
    # until the next reboot, so restarting watchdog-mux would just reopen
    # softdog. After rebooting, `journalctl -u watchdog-mux -b` should read
    # "Watchdog driver 'SP5100 TCO timer'".
    - name: Use the hardware TCO watchdog for watchdog-mux (takes effect on reboot)
      ansible.builtin.lineinfile:
        path: /etc/default/pve-ha-manager
        regexp: '^#?\s*WATCHDOG_MODULE='
        line: WATCHDOG_MODULE=sp5100_tco
        create: true
        mode: "0644"

    - name: Check which watchdog driver is active
      ansible.builtin.command: cat /sys/class/watchdog/watchdog0/identity
      register: watchdog_identity
      changed_when: false
      check_mode: false

    - name: Warn that a reboot is needed to switch to the hardware watchdog
      ansible.builtin.debug:
        msg: >-
          watchdog0 is still '{{ watchdog_identity.stdout }}'. The hardware
          watchdog takes effect on the next reboot of the PVE host.
      when: "'SP5100' not in watchdog_identity.stdout"

    # panic=10 reboots 10s after a kernel panic instead of sitting there
    # forever (default 0). hardlockup_panic turns an NMI-detected hard lockup
    # into a panic, and so a reboot. softlockup_panic and hung_task_panic are
    # deliberately left off: on a ZFS + NFS server, a long scrub or an NFS
    # stall would turn into a reboot.
    - name: Reboot on kernel panic and hard lockup
      ansible.builtin.copy:
        content: |
          kernel.panic = 10
          kernel.hardlockup_panic = 1
        dest: /etc/sysctl.d/90-panic-reboot.conf
        mode: "0644"
      notify: Apply panic sysctls

    # Writes a marker on clean shutdown and checks for it at boot. If it's
    # missing, the last boot ended in a hang or hard reset: the script logs a
    # daemon.crit line (Loki ruler alert HostUncleanShutdown), and posts to
    # the heartbeat URL's /fail endpoint if one is configured.
    - name: Deploy the unclean-shutdown check script
      ansible.builtin.template:
        src: templates/pve/pve-boot-check.sh.j2
        dest: /usr/local/sbin/pve-boot-check
        mode: "0755"

    - name: Deploy the heartbeat environment file
      ansible.builtin.copy:
        content: |
          PVE_HEARTBEAT_URL={{ pve_heartbeat_url }}
        dest: /etc/default/pve-heartbeat
        mode: "0600"
      # The repo is public: keep the ping URL out of CI logs if --diff or
      # -v is ever added, since anyone holding it can mask an outage.
      no_log: true

    - name: Create the unclean-shutdown check unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Report whether the previous boot ended with a clean shutdown
          Wants=network-online.target
          After=network-online.target time-sync.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          EnvironmentFile=-/etc/default/pve-heartbeat
          ExecStart=/usr/local/sbin/pve-boot-check start
          ExecStop=/usr/local/sbin/pve-boot-check stop

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/pve-boot-check.service
        mode: "0644"

    - name: Enable the unclean-shutdown check
      ansible.builtin.systemd:
        name: pve-boot-check.service
        enabled: true
        state: started
        daemon_reload: true

    # A dead-man's switch has to live off the host: Prometheus, Alertmanager
    # and its Home Assistant receiver all run on this host and freeze with
    # it, so a hang used to page nobody. The host pings an external check
    # (e.g. healthchecks.io) every minute, and the service alerts when the
    # pings stop. It also fires if the home internet goes down. Skipped
    # until vault_pve_heartbeat_url is set.
    - name: Create the heartbeat unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Ping the external heartbeat check
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          EnvironmentFile=/etc/default/pve-heartbeat
          ExecStart=/usr/bin/curl -fsS -m 10 --retry 3 -o /dev/null ${PVE_HEARTBEAT_URL}
        dest: /etc/systemd/system/pve-heartbeat.service
        mode: "0644"

    - name: Create the heartbeat timer
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Ping the external heartbeat check every minute

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=1min
          AccuracySec=5s

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/pve-heartbeat.timer
        mode: "0644"

    - name: Enable the heartbeat timer when a URL is configured
      ansible.builtin.systemd:
        name: pve-heartbeat.timer
        enabled: "{{ pve_heartbeat_url | length > 0 }}"
        state: "{{ 'started' if pve_heartbeat_url | length > 0 else 'stopped' }}"
        daemon_reload: true

    # --- etcd snapshots ---------------------------------------------------
    # The only etcd copy besides crash-consistent PBS images of VM 112. The
    # snapshot contains every Kubernetes Secret, so it lives in its own Tank
    # dataset that is not NFS-exported (unlike media_root and k8s-configs,
    # which are exported no_root_squash to the whole /24). 04:30 stays clear
    # of the 02:30/02:40 database dumps and the 03:00 PBS host backup, since
    # pool contention is what stalls etcd's WAL fsync.
    - name: Install talosctl
      ansible.builtin.get_url:
        url: "https://github.com/siderolabs/talos/releases/download/v{{ talosctl_version }}/talosctl-linux-amd64"
        dest: /usr/local/bin/talosctl
        checksum: "sha256:{{ talosctl_sha256 }}"
        mode: "0755"

    - name: Create the etcd snapshot ZFS dataset
      community.general.zfs:
        name: Tank/etcd-backups
        state: present
        extra_zfs_properties:
          sharenfs: "off"

    - name: Restrict the etcd snapshot directory
      ansible.builtin.file:
        path: "{{ etcd_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create the Talos client config directory
      ansible.builtin.file:
        path: /etc/talos
        state: directory
        mode: "0700"

    - name: Deploy the snapshot-only Talos client config
      ansible.builtin.copy:
        content: "{{ etcd_backup_config }}"
        dest: /etc/talos/etcd-backup.talosconfig
        mode: "0600"
      when: etcd_backup_config | length > 0
      no_log: true

    - name: Deploy the etcd snapshot script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          set -euo pipefail
          dir={{ etcd_backup_dir }}
          tmp=$(mktemp "$dir/.snapshot.XXXXXX")
          trap 'rm -f "$tmp"' EXIT
          talosctl --talosconfig /etc/talos/etcd-backup.talosconfig \
            -e {{ etcd_backup_cp_ip }} -n {{ etcd_backup_cp_ip }} etcd snapshot "$tmp"
          # A real snapshot is tens of MB; fail loudly on an empty/partial file.
          [ "$(stat -c %s "$tmp")" -gt 1000000 ]
          out="$dir/etcd-$(date +%Y%m%d-%H%M%S).db"
          mv "$tmp" "$out"
          trap - EXIT
          chmod 600 "$out"
          find "$dir" -maxdepth 1 -name 'etcd-*.db' -mtime +14 -delete
          ls -la "$out"
        dest: /usr/local/sbin/etcd-snapshot
        mode: "0755"

    - name: Create the etcd snapshot unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Snapshot etcd on the Talos control plane
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/etcd-snapshot
        dest: /etc/systemd/system/etcd-snapshot.service
        mode: "0644"

    - name: Create the etcd snapshot timer
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Snapshot etcd daily

          [Timer]
          OnCalendar=*-*-* 04:30:00
          Persistent=true
          RandomizedDelaySec=5min

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/etcd-snapshot.timer
        mode: "0644"

    - name: Enable the etcd snapshot timer when a client config is set
      ansible.builtin.systemd:
        name: etcd-snapshot.timer
        enabled: "{{ etcd_backup_config | length > 0 }}"
        state: "{{ 'started' if etcd_backup_config | length > 0 else 'stopped' }}"
        daemon_reload: true

  handlers:
    - name: Apply panic sysctls
      ansible.builtin.command: sysctl -p /etc/sysctl.d/90-panic-reboot.conf
      changed_when: true

    - name: Update initramfs
      ansible.builtin.command: update-initramfs -u -k all
      changed_when: true

    - name: Restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted

    - name: Reload exports
      ansible.builtin.command: exportfs -ra
      changed_when: true
