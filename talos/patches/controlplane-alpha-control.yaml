# Dedicated control-plane VM (2 vCPU / 4GB, x86) — joins the existing
# alpha+beta-rpi5 etcd as a third, fault-tolerant member. Control-plane only:
# workloads stay on alpha (nest.arishaig.site/workloads=general), never here.
# See /home/isaac/.claude/plans/silly-riding-stroustrup.md for the full
# control-plane migration this is Phase 1 of.
#
# Talos 1.14 multi-document config: `talosctl gen config` now emits dedicated
# docs (ResolverConfig, KubeNodeConfig, KubeAPIServerConfig, …), so the
# corresponding settings can no longer also live under v1alpha1
# `machine:`/`cluster:` — doing both fails `talosctl validate` with "… is
# already set in v1alpha1 config". Docs here: v1alpha1 (cluster.etcd +
# machine.network + machine.time) · KubeAPIServerConfig ·
# KubeControllerManagerConfig · KubeSchedulerConfig · ResolverConfig ·
# KubeNodeConfig · HostnameConfig. 1.14-only — to rejoin from pre-1.14 media,
# use the pre-migration revision from git history.
#
# allowSchedulingOnControlPlanes: false was dropped — 1.14 multi-doc has no
# such field and false is the default (the CP NoSchedule taint stays), which is
# exactly the intent for a dedicated control-plane node that runs no workloads.
cluster:
  etcd:
    advertisedSubnets:
      - 192.168.1.0/24

machine:
  network:
    interfaces:
      - interface: ens18
        dhcp: false
        addresses:
          - 192.168.1.119/24
        vip:
          ip: 192.168.1.115
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  time:
    servers:
      - 192.168.7.7
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-alpha-control
---
apiVersion: v1alpha1
kind: ResolverConfig
# Was machine.network.nameservers.
nameservers:
  - address: 192.168.7.7
  - address: 192.168.7.8
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# Was machine.kubelet.nodeIP. No node labels — workloads never schedule here.
nodeIP:
  validSubnets:
    - 192.168.1.0/24
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
# Was cluster.apiServer.resources.
resources:
  requests:
    cpu: 250m
    memory: 768Mi
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
# Was cluster.controllerManager.resources.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
# Was cluster.scheduler.resources.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
