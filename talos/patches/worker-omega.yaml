# omega — the user's gaming PC, dual-booted between Windows and Talos on a
# dedicated second disk. NOT Proxmox/Terraform-managed like every other node
# in this cluster; it's physical hardware the user owns and reboots into
# Windows at will. Expected to be offline for hours at a time — that's normal
# for this node, not an incident (see KubeNodeNotReady exclusion in
# playbooks/provision/files/monitoring/prometheus/rules/nest.yml). Onboarded
# for its RTX 3080, primarily for GPU-accelerated transcription workloads.
# See docs/gaming-gpu-talos.md for the full runbook.
#
# Scope as of onboarding: this node runs nothing but the NVIDIA GPU Operator
# (k8s/infrastructure/nvidia-gpu-operator/). Wiring an actual workload
# (subgen/whisper) to request nvidia.com/gpu and prefer this node is a
# deliberate follow-up, not done here.
#
# Jellyfin must NEVER schedule here — see the hard anti-affinity in
# k8s/apps/media/jellyfin.yaml. Everything else that opts into this node's
# label must use NFS-backed storage (nfs-nvme / media-nfs), never
# local-path — a pod bound to node-local storage would not reschedule when
# this node goes offline, defeating the entire point.
#
# Talos 1.14 multi-document config: `talosctl gen config` now emits dedicated
# docs (ResolverConfig, KubeNodeConfig, UnattendedInstallConfig, …), so
# DNS/kubelet/node/install settings can no longer also live under v1alpha1
# `machine:` — doing both fails `talosctl validate` with "… is already set in
# v1alpha1 config" / "UnattendedInstallConfig config is incompatible with
# v1alpha1 config". Docs here: v1alpha1 (machine.kernel + machine.network +
# machine.time) · ResolverConfig · KubeNodeConfig · UnattendedInstallConfig ·
# HostnameConfig. 1.14-only.
machine:
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  network:
    interfaces:
      # NIC name on this hardware isn't known in advance — select the only
      # physical NIC, same reasoning as the RPi5 patches.
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.1.120/24
        # No `vip:` entry — vip is control-plane-only (etcd leader election
        # for 192.168.1.115). Workers reach the API via
        # cluster.controlPlane.endpoint + KubePrism.
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
  time:
    servers:
      - 192.168.7.7
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: "off"
hostname: talos-omega
---
apiVersion: v1alpha1
kind: ResolverConfig
# Was machine.network.nameservers.
nameservers:
  - address: 192.168.7.7
  - address: 192.168.7.8
---
apiVersion: v1alpha1
kind: KubeNodeConfig
# Was machine.kubelet.nodeIP + machine.nodeLabels.
nodeIP:
  validSubnets:
    - 192.168.1.0/24
labels:
  nest.arishaig.site/workloads: omega
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
# Was machine.install (diskSelector.wwid + image).
#
# Disk match: target the dedicated second disk by wwid, NOT a /dev/nvmeXn1 or
# /dev/sdX path — with multiple drives in the machine (Windows + this one),
# enumeration order is not guaranteed stable across reboots, and a path-based
# target is how a future reinstall could hit the Windows disk. Confirmed via
# `talosctl get disks --insecure` in maintenance mode: two identical 500GB
# Crucial MX500 SSDs plus the Windows NVMe; the MX500s report no serial over
# SATA, so the install disk was identified by its wwid (naa.500a0751e1f47eb4,
# the by-id ata-CT500MX500SSD1_1912E1F47EB4 link). The CEL form below passes
# `talosctl validate` (schema only) with talosctl v1.14.0 — re-confirm the
# accessor against `talosctl get disks` output before the next omega rebuild;
# fall back to a symlink match ("<by-id>" in disk.symlinks) if it doesn't bind.
#
# Image: Image Factory installer for schematic 6698d6f1... (nvidia-open-gpu-
# kernel-modules + nvidia-container-toolkit, production branch). A plain
# ghcr.io/siderolabs/installer would strip both NVIDIA extensions on upgrade.
# Renovate bumps this tag in lockstep with talos_version (see renovate.json);
# keep the installer URL appearing exactly once in this file.
installer:
  image: factory.talos.dev/installer/6698d6f136c5bb37ca8bb8482c9084305084da0a5ead1f4dcae760796f8ab3a2:v1.14.0
provisioning:
  diskSelector:
    match: disk.wwid == "naa.500a0751e1f47eb4"
  # MANDATORY: UnattendedInstallConfig.provisioning.wipe defaults to TRUE
  # (v1alpha1 machine.install.wipe defaulted false). Omit this line and every
  # install/upgrade wipes the target disk.
  wipe: false
