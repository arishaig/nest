name: Maintenance

# Manually triggered OS updates, the GitOps path for everything that
# unattended-upgrades (playbooks/provision/unattended-upgrades.yml) doesn't
# do on its own: non-security updates on the guests, and all updates on PVE
# and PBS, which never update unattended.
#
#   guests    LXCs, DNS Pis and the VPS via update_apt.yml, one host at a
#             time. Never reboots.
#   proxmox   PBS then the PVE host via update_proxmox.yml (dist-upgrade).
#             "upgrade-and-reboot" reboots PBS (waiting for it), then
#             schedules the PVE reboot 2 minutes out. That takes the whole
#             lab down for a few minutes, including this runner, so the job
#             ends green before it fires; check lab_health_summary after.
#
# Pick a time when a PVE reboot is acceptable and no PBS backup is running.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which hosts'
        type: choice
        options:
          - guests
          - proxmox
        default: guests
      mode:
        description: 'check = list only; reboot applies to proxmox only'
        type: choice
        options:
          - check
          - upgrade
          - upgrade-and-reboot
        default: check

# Same group as deploy.yml, so maintenance never overlaps a deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write SSH key
        run: |
          install -d -m 700 "$RUNNER_TEMP/.ssh"
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/.ssh/ansible-on-nest"
          chmod 600 "$RUNNER_TEMP/.ssh/ansible-on-nest"

      - name: Write vault password
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASS }}" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"

      - name: Run maintenance playbook
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
        run: |
          source /opt/ansible-runner/venv/bin/activate
          extra=()
          case "$TARGET/$MODE" in
            guests/check)   playbook=playbooks/check_updates.yml ;;
            guests/*)       playbook=playbooks/update_apt.yml ;;
            proxmox/check)  playbook=playbooks/update_proxmox.yml ;;
            proxmox/upgrade)
              playbook=playbooks/update_proxmox.yml
              extra=(-e do_upgrade=true) ;;
            proxmox/upgrade-and-reboot)
              playbook=playbooks/update_proxmox.yml
              extra=(-e do_upgrade=true -e do_reboot=true) ;;
            *) echo "unknown target/mode: $TARGET/$MODE"; exit 1 ;;
          esac
          ansible-playbook \
            -i inventory/hosts.yml \
            "$playbook" \
            "${extra[@]}" \
            --vault-password-file "$RUNNER_TEMP/vault-pass" \
            --private-key "$RUNNER_TEMP/.ssh/ansible-on-nest" \
            --ssh-extra-args "-o StrictHostKeyChecking=no"
