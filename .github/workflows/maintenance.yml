name: Maintenance

# Manually triggered OS updates, the GitOps path for everything that
# unattended-upgrades (playbooks/provision/unattended-upgrades.yml) doesn't
# do on its own: non-security updates on the guests, and all updates on PVE
# and PBS, which never update unattended.
#
#   guests    LXCs, DNS Pis and the VPS via update_apt.yml, one host at a
#             time. "upgrade" never reboots. "reboot" runs reboot_guests.yml:
#             it reboots only the DNS Pis and the VPS that are on an old
#             kernel, one at a time, secondary DNS first and the primary
#             AdGuard Pi last, refusing to take a Pi down unless the other
#             one answers DNS. LXCs share the PVE kernel and are never
#             rebooted (ci is also this runner). "upgrade-and-reboot" does
#             both, upgrade first.
#   proxmox   PBS then the PVE host via update_proxmox.yml (dist-upgrade).
#             "upgrade-and-reboot" reboots PBS (waiting for it), then
#             schedules the PVE reboot 2 minutes out. That takes the whole
#             lab down for a few minutes, including this runner, so the job
#             ends green before it fires; check lab_health_summary after.
#
# Pick a time when a PVE reboot is acceptable and no PBS backup is running.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which hosts'
        type: choice
        options:
          - guests
          - proxmox
        default: guests
      mode:
        description: 'check = list only; reboot = guests only (old-kernel DNS Pis/VPS); upgrade-and-reboot = both targets'
        type: choice
        options:
          - check
          - upgrade
          - reboot
          - upgrade-and-reboot
        default: check

# Same group as deploy.yml, so maintenance never overlaps a deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write SSH key
        run: |
          install -d -m 700 "$RUNNER_TEMP/.ssh"
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/.ssh/ansible-on-nest"
          chmod 600 "$RUNNER_TEMP/.ssh/ansible-on-nest"

      - name: Write SOPS age key
        run: |
          printf '%s\n' "${{ secrets.SOPS_AGE_KEY }}" > "$RUNNER_TEMP/age.key"
          chmod 600 "$RUNNER_TEMP/age.key"
          echo "SOPS_AGE_KEY_FILE=$RUNNER_TEMP/age.key" >> "$GITHUB_ENV"

      - name: Run maintenance playbook
        env:
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
        run: |
          source /opt/ansible-runner/venv/bin/activate
          extra=()
          playbooks=()
          case "$TARGET/$MODE" in
            guests/check)   playbooks=(playbooks/check_updates.yml) ;;
            guests/upgrade) playbooks=(playbooks/update_apt.yml) ;;
            guests/reboot)  playbooks=(playbooks/reboot_guests.yml) ;;
            guests/upgrade-and-reboot)
              playbooks=(playbooks/update_apt.yml playbooks/reboot_guests.yml) ;;
            proxmox/check)  playbooks=(playbooks/update_proxmox.yml) ;;
            proxmox/upgrade)
              playbooks=(playbooks/update_proxmox.yml)
              extra=(-e do_upgrade=true) ;;
            proxmox/upgrade-and-reboot)
              playbooks=(playbooks/update_proxmox.yml)
              extra=(-e do_upgrade=true -e do_reboot=true) ;;
            *) echo "unknown target/mode: $TARGET/$MODE"; exit 1 ;;
          esac
          for playbook in "${playbooks[@]}"; do
            ansible-playbook \
              -i inventory/hosts.yml \
              "$playbook" \
              "${extra[@]}" \
              --private-key "$RUNNER_TEMP/.ssh/ansible-on-nest" \
              --ssh-extra-args "-o StrictHostKeyChecking=no"
          done
