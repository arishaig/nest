name: lidarr-ui Tests

# Smoke test for lidarr-ui (architecture-review.md G3): before this workflow,
# nothing gated a broken commit from becoming a running container. This is
# intentionally lighter than mcp-tests.yml — no coverage gate, just proof the
# app still starts and serves its index route.
on:
  pull_request:
    branches: [main]
    paths:
      - 'lidarr-ui/**'
      - '.github/workflows/lidarr-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lidarr-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install and run tests
        working-directory: lidarr-ui
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pytest
