name: Lint

on:
  pull_request:
    branches: [main]
  push:
    # Re-validate main after merge so the README status badge reflects the
    # default branch, not just the last PR.
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs rather than queueing them. A lint result only matters
# for the newest commit — on a PR, older pushes are moot once a new one lands;
# on main, a merge's checks are informational once the next merge supersedes
# it. Without this, stacking several merges within a few minutes fans out a
# full ~11-job x N-run burst of arc-lint runner pods all at once: on
# 2026-07-31 four merges within ~3 minutes queued 21 runner pods onto the
# single schedulable amd64 node, which starved talos-alpha-control (2 vCPU)
# enough to crash-loop kube-scheduler and kube-controller-manager. Safe to
# cancel here (unlike deploy.yml's queue-don't-cancel policy) because nothing
# here is a half-applied mutation — it's read-only checks.
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ansible-lint:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Write vault password
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASS }}" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"
      - name: Run ansible-lint
        run: |
          source /opt/ansible-runner/venv/bin/activate
          # Unset VIRTUAL_ENV so ansible-compat doesn't attempt to cache into
          # the read-only system venv; it falls back to .ansible/ in the project dir.
          unset VIRTUAL_ENV
          ANSIBLE_VAULT_PASSWORD_FILE="$RUNNER_TEMP/vault-pass" ansible-lint playbooks/

  yamllint:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run yamllint
        # Covers the GitOps service payload under playbooks/provision/files/,
        # which ansible-lint deliberately excludes. Lenient by design — see
        # .yamllint — so it flags only deploy-breaking errors (unparsable
        # YAML, duplicate keys), not cosmetic style.
        run: |
          source /opt/ansible-runner/venv/bin/activate
          unset VIRTUAL_ENV
          yamllint .

  config-validate:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Docker Compose schemas
        # --no-interpolate validates structure without substituting the
        # vault-derived env vars (which aren't present in CI).
        run: |
          rc=0
          while IFS= read -r f; do
            if docker compose -f "$f" config --no-interpolate -q; then
              echo "[ok] $f"
            else
              echo "[FAIL] $f"
              rc=1
            fi
          done < <(find playbooks/provision/files -name docker-compose.yml | sort)
          exit $rc
      - name: Validate Grafana dashboard JSON
        run: |
          rc=0
          while IFS= read -r f; do
            if jq empty "$f" 2>/dev/null; then
              echo "[ok] $f"
            else
              echo "[FAIL] $f"
              rc=1
            fi
          done < <(find playbooks/provision/files -name '*.json' | sort)
          exit $rc

  deploy-coverage:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check deploy filter covers all services
        run: scripts/check-deploy-coverage.sh

  runner-toolchain-sync:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check ci/runner/Dockerfile and runner.yml pin the same versions
        run: scripts/check-runner-toolchain-sync.sh

  talos-rpi5-overlay:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check Image Factory serves rpi_5 for the pinned Talos version
        # Overlay releases can lag a Talos patch release by a few days
        # (siderolabs/talos#12748); merging a version bump before the overlay
        # exists would strand the Pi nodes. Also catches drift between
        # terraform.tfvars and the installer tags in talos/patches/.
        run: scripts/check-talos-rpi5-overlay.sh

  prometheus-validate:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Prometheus alerting rules
        run: promtool check rules playbooks/provision/files/monitoring/prometheus/rules/*.yml
      - name: Validate Alertmanager config
        # The config is a Jinja template; substitute every {{ ... }} with a
        # placeholder so amtool can check the structure without vault values.
        run: |
          tmp=$(mktemp)
          sed -E 's#\{\{[^}]*\}\}#http://example.invalid/placeholder#g' \
            playbooks/provision/templates/monitoring/alertmanager.yml.j2 > "$tmp"
          amtool check-config "$tmp"
          rm -f "$tmp"

  shellcheck:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run shellcheck
        # The runner's shellcheck is 0.10.0, which flags SC2015 on the benign
        # `[[ -z x ]] && x=... || true` set-e guards in pull-secrets.sh (0.11.0
        # dropped that). Exclude only SC2015 and keep default severity so
        # info-level checks like SC2086 (unquoted vars) stay enforced.
        run: shellcheck --exclude=SC2015 scripts/*.sh

  k8s-validate:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and validate k8s manifests
        # kustomize build catches missing file references and broken overlays.
        # kubeconform validates the rendered manifests against the k8s 1.32 API
        # schema (-strict rejects unknown fields; -ignore-missing-schemas skips
        # any CRDs we haven't registered schemas for rather than hard-failing).
        # flux-system is bootstrapped by Flux itself and contains Flux CRDs not
        # in the standard schema catalog — skip it.
        run: |
          fail=0
          for root in k8s/apps k8s/infrastructure; do
            echo "=== kustomize build ${root} ==="
            if ! kustomize build "${root}" \
                | kubeconform \
                    -strict \
                    -ignore-missing-schemas \
                    -kubernetes-version 1.32.0 \
                    -summary; then
              echo "FAIL: ${root}"
              fail=1
            fi
          done
          exit $fail

  helm-render:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render HelmReleases and validate the output
        # kustomize build (the k8s-validate job) passes Flux HelmRelease CRs
        # through opaquely — it never invokes Helm — so the Deployments,
        # Services and PVCs the bjw-s app-template chart actually renders are
        # otherwise unvalidated. flux-local resolves each HelmRelease against
        # its (public OCI) HelmRepository, runs helm template, and we pipe the
        # rendered manifests through kubeconform against the k8s 1.32 schema.
        run: |
          flux-local test --enable-helm --path k8s/flux-system --kube-version 1.32.0
          flux-local build all --enable-helm --output-file "$RUNNER_TEMP/rendered.yaml" k8s/flux-system
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version 1.32.0 \
            -summary \
            "$RUNNER_TEMP/rendered.yaml"
      - name: Check no workload owns its own PVC
        # Data-safety contract: every config/state PVC must be a raw, Flux-owned
        # manifest bound via existingClaim, never created by the app-template
        # chart (which Flux would then prune → data loss). Reuses the render
        # above to avoid a second helm pull.
        run: scripts/check-helm-pvc-safety.sh "$RUNNER_TEMP/rendered.yaml"

  talos-config-validate:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Render and validate Talos machine configs
        # Generates each control-plane machine config from talos/patches/ with
        # throwaway secrets and runs `talosctl validate -m metal`. Catches a
        # malformed patch (bad field, broken interface/VIP) before it reaches a
        # node — the VM/network surface the docker integration test can't cover.
        run: scripts/check-talos-config.sh

  tofu:
    runs-on: arc-lint
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check OpenTofu formatting
        run: tofu -chdir=terraform fmt -check -recursive
      - name: Validate OpenTofu configuration
        run: |
          cd terraform
          tofu init -backend=false -input=false
          tofu validate

  # G1: infrastructure changes were previously first *executed* by deploy-tofu
  # on merge, against unlocked state, with no human seeing the diff first —
  # `validate` above only checks syntax, not what a change actually does (see
  # the duplicated-AdGuard-rewrites/orphaned-VM incident recorded in
  # deploy.yml). This posts a real plan on the PR itself.
  #
  # Needs the self-hosted runner (state file + AdGuard tunnel), unlike the
  # arc-lint jobs above, so it's a separate job gated on terraform/** to avoid
  # putting every PR through Proxmox/Vultr/AdGuard API reachability. It only
  # reads state (copies in, never writes back — deploy-tofu on main is the
  # only writer) but state is unlocked (C3), so this plan can still race a
  # concurrent apply; treat it as informational, not a required check.
  tofu-plan:
    runs-on: self-hosted
    env:
      TF_PLUGIN_CACHE_DIR: /opt/terraform-plugin-cache
      TF_STATE_DIR: /opt/terraform-state/nest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            tofu:
              - 'terraform/**'

      - name: Write SSH key
        if: steps.filter.outputs.tofu == 'true'
        run: |
          install -d -m 700 "$RUNNER_TEMP/.ssh"
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/.ssh/ansible-on-nest"
          chmod 600 "$RUNNER_TEMP/.ssh/ansible-on-nest"

      - name: Write secrets.tfvars
        if: steps.filter.outputs.tofu == 'true'
        env:
          TF_SECRETS: ${{ secrets.TF_SECRETS_TFVARS }}
        run: |
          printf '%s' "$TF_SECRETS" > terraform/secrets.tfvars
          chmod 600 terraform/secrets.tfvars

      - name: Restore OpenTofu state
        if: steps.filter.outputs.tofu == 'true'
        run: |
          if [ ! -f "$TF_STATE_DIR/terraform.tfstate" ]; then
            echo "::error::No OpenTofu state at $TF_STATE_DIR — refusing a stateless plan."
            exit 1
          fi
          cp "$TF_STATE_DIR/terraform.tfstate" terraform/terraform.tfstate

      # Local port 13001, not deploy-tofu's 13000: both jobs run on the same
      # shared self-hosted runner pool, and a plan overlapping an apply
      # (or two plans overlapping) collided on the port — deploy-tofu failed
      # with "Address already in use" the first time this job ran for real
      # (2026-07-31). tofu.tfvars' adguard_tertiary_port default stays 13000
      # for deploy-tofu; this job overrides it below instead.
      - name: Open VPS AdGuard tunnel
        if: steps.filter.outputs.tofu == 'true'
        run: |
          ssh -f -N -L 13001:localhost:3000 \
            -i "$RUNNER_TEMP/.ssh/ansible-on-nest" \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            root@66.42.79.175
          for _ in $(seq 1 10); do nc -z 127.0.0.1 13001 2>/dev/null && break; sleep 1; done

      - name: OpenTofu init
        if: steps.filter.outputs.tofu == 'true'
        run: tofu -chdir=terraform init -input=false

      - name: OpenTofu plan
        if: steps.filter.outputs.tofu == 'true'
        # -exclude=vultr_instance.vps_proxy (2026-08-03): see deploy.yml's
        # OpenTofu apply step for why.
        run: |
          set -o pipefail
          tofu -chdir=terraform plan -var-file=secrets.tfvars -var adguard_tertiary_port=13001 -input=false -no-color \
            -exclude=vultr_instance.vps_proxy \
            2>&1 | tee "$RUNNER_TEMP/tofu-plan.log"

      - name: Post plan to job summary
        if: always() && steps.filter.outputs.tofu == 'true'
        run: |
          {
            echo '### OpenTofu plan'
            echo '```'
            cat "$RUNNER_TEMP/tofu-plan.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close AdGuard tunnel
        if: always() && steps.filter.outputs.tofu == 'true'
        run: pkill -f "ssh -f -N -L 13001" 2>/dev/null || true
