[defaults]
inventory = inventory/hosts.yml
private_key_file = ~/.ssh/ansible-on-nest
# Secrets: inventory/group_vars/all.sops.yaml, decrypted by the
# community.sops vars plugin with the age key (docs/secrets.md).
vars_plugins_enabled = host_group_vars,community.sops.sops
stdout_callback = default
host_key_checking = False

[ssh_connection]
pipelining = True